    # Repository schemas
    Repository:
      type: object
      description: A GEDCOM REPO (repository) record describing where source documents are stored
      required: [id, name, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Repository's name
        address:
          $ref: '#/components/schemas/Address'
        notes:
          type: string
          description: Free-form notes about the repository
        gedcom_xref:
          type: string
          description: GEDCOM cross-reference ID for round-trip support
        version:
          type: integer
          format: int64
          description: Optimistic locking version
        updated_at:
          type: string
          format: date-time

    RepositoryDetail:
      allOf:
        - $ref: '#/components/schemas/Repository'
        - type: object
          properties:
            external_ids:
              type: array
              description: >-
                GEDCOM 7.0 external identifiers (EXID) with resolved display label and link.
                Read-only: populated from GEDCOM import; there is no direct-write endpoint.
              items:
                $ref: '#/components/schemas/ExternalLink'

    RepositoryCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Repository's name
          minLength: 1
          maxLength: 200
        address:
          $ref: '#/components/schemas/Address'
        notes:
          type: string
