openapi: 3.0.3
info:
  title: My Family Genealogy API
  description: |
    REST API for self-hosted genealogy software. Supports person and family
    management, GEDCOM import/export, pedigree visualization, and search.
  version: 1.0.0
  license:
    name: MIT

servers:
  - url: /api/v1
    description: API version 1

tags:
  - name: persons
    description: Individual person management
  - name: families
    description: Family unit management
  - name: pedigree
    description: Ancestry visualization
  - name: search
    description: Person search
  - name: browse
    description: Browse by surname and place
  - name: gedcom
    description: GEDCOM import/export
  - name: sources
    description: Source record management
  - name: citations
    description: Citation management
  - name: citation-templates
    description: Evidence Explained citation templates
  - name: export
    description: Data export
  - name: history
    description: Change history and audit trail
  - name: rollback
    description: Rollback and restore point management
  - name: media
    description: Media file management (photos, documents)
  - name: quality
    description: Data quality metrics
  - name: statistics
    description: Tree-wide statistics
  - name: reports
    description: Genealogical reports (Ahnentafel, etc.)
  - name: snapshots
    description: Research milestone snapshots
  - name: branches
    description: Isolated lines of research (ADR-005)
  - name: relationships
    description: Relationship calculation between people
  - name: notes
    description: GEDCOM NOTE record management
  - name: submitters
    description: GEDCOM SUBM record management (file provenance)
  - name: repositories
    description: GEDCOM REPO record management (where sources are stored)
  - name: associations
    description: GEDCOM ASSO record management (non-family relationships)
  - name: lds-ordinances
    description: LDS temple ordinance management (BAPL, CONL, ENDL, SLGC, SLGS)
  - name: evidence-analyses
    description: Evidence analysis management (GPS-compliant evidence evaluation)
  - name: evidence-conflicts
    description: Evidence conflict detection and resolution
  - name: research-logs
    description: Research log entries tracking searches and outcomes
  - name: proof-summaries
    description: Proof summary management (GPS-compliant proof arguments)

paths:
  /persons:
    get:
      operationId: listPersons
      summary: List all persons
      tags: [persons]
      parameters:
        - $ref: '#/components/parameters/branchScope'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
        - name: sort
          in: query
          schema:
            type: string
            enum: [surname, given_name, birth_date, updated_at]
            default: surname
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: research_status
          in: query
          description: Filter by research status
          schema:
            type: string
            enum: [certain, probable, possible, unknown, unset]
      responses:
        '200':
          description: List of persons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      operationId: createPerson
      summary: Create a new person
      tags: [persons]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonCreate'
      responses:
        '201':
          description: Person created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /persons/{id}:
    parameters:
      - $ref: '#/components/parameters/personId'

    get:
      operationId: getPerson
      summary: Get a person by ID
      tags: [persons]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      responses:
        '200':
          description: Person details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonDetail'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      operationId: updatePerson
      summary: Update a person
      tags: [persons]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonUpdate'
      responses:
        '200':
          description: Person updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      operationId: deletePerson
      summary: Delete a person
      tags: [persons]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      responses:
        '204':
          description: Person deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Person is linked to families, or the target branch is not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /families:
    get:
      operationId: listFamilies
      summary: List all families
      tags: [families]
      parameters:
        - $ref: '#/components/parameters/branchScope'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
      responses:
        '200':
          description: List of families
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyList'

    post:
      operationId: createFamily
      summary: Create a new family
      description: |
        When `branch` is supplied the family is created on that branch only, and
        partner ids are resolved through the branch overlay — a person that
        exists only on the branch may be a partner.
      tags: [families]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamilyCreate'
      responses:
        '201':
          description: Family created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Family'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /families/{id}:
    parameters:
      - $ref: '#/components/parameters/familyId'

    get:
      operationId: getFamily
      summary: Get a family by ID
      tags: [families]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      responses:
        '200':
          description: Family details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyDetail'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      operationId: updateFamily
      summary: Update a family
      tags: [families]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamilyUpdate'
      responses:
        '200':
          description: Family updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Family'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      operationId: deleteFamily
      summary: Delete a family
      description: |
        When `branch` is supplied the family is deleted on that branch only (the
        mainline row survives) and the child count is read through the branch
        overlay, so a family whose children were unlinked on the branch deletes
        cleanly there.
      tags: [families]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      responses:
        '204':
          description: Family deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Family has children and cannot be deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /families/{id}/children:
    parameters:
      - $ref: '#/components/parameters/familyId'

    post:
      operationId: addChildToFamily
      summary: Add a child to a family
      description: |
        When `branch` is supplied the link is made on that branch only. The
        family and child are resolved through the branch overlay, so repeated
        links on the same family within one branch work.
      tags: [families]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddChild'
      responses:
        '201':
          description: Child added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyChild'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Child already belongs to a family or circular relationship
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /families/{id}/children/{personId}:
    parameters:
      - $ref: '#/components/parameters/familyId'
      - name: personId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    delete:
      operationId: removeChildFromFamily
      summary: Remove a child from a family
      description: |
        When `branch` is supplied the link is removed on that branch only (the
        mainline link survives). The child's family is resolved through the
        branch overlay, so a link made on the branch can be undone there.
      tags: [families]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      responses:
        '204':
          description: Child removed
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Version conflict while unlinking the child
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /families/{id}/group-sheet:
    parameters:
      - $ref: '#/components/parameters/familyId'

    get:
      operationId: getFamilyGroupSheet
      summary: Get family group sheet data
      description: |
        Returns a traditional family group sheet view showing a family unit
        with parents and children, key events (birth, marriage, death),
        and source citations. This is a standard format used by genealogists
        worldwide for documenting family units.
      tags: [families]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      responses:
        '200':
          description: Family group sheet data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyGroupSheet'
        '404':
          $ref: '#/components/responses/NotFound'

  /pedigree/{id}:
    parameters:
      - $ref: '#/components/parameters/personId'

    get:
      operationId: getPedigree
      summary: Get ancestor pedigree for a person
      tags: [pedigree]
      parameters:
        - $ref: '#/components/parameters/branchScope'
        - name: generations
          in: query
          description: Number of ancestor generations to include
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 4
      responses:
        '200':
          description: Pedigree data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedigree'
        '404':
          $ref: '#/components/responses/NotFound'

  /descendancy/{id}:
    parameters:
      - $ref: '#/components/parameters/personId'

    get:
      operationId: getDescendancy
      summary: Get descendancy tree for a person
      description: |
        Returns the descendant tree for a person, showing children, grandchildren,
        and so on, along with spouse information for each generation.
      tags: [pedigree]
      parameters:
        - $ref: '#/components/parameters/branchScope'
        - name: generations
          in: query
          description: Number of descendant generations to include
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 4
      responses:
        '200':
          description: Descendancy data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Descendancy'
        '404':
          $ref: '#/components/responses/NotFound'

  /ahnentafel/{id}:
    parameters:
      - $ref: '#/components/parameters/personId'

    get:
      operationId: getAhnentafel
      summary: Get Ahnentafel (ancestor table) report for a person
      description: |
        Returns an Ahnentafel report listing ancestors using the standard numbering system:
        1 = subject, 2 = father, 3 = mother, 4 = paternal grandfather, etc.
        Each ancestor's number n has father at 2n and mother at 2n+1.
      tags: [reports]
      parameters:
        - $ref: '#/components/parameters/branchScope'
        - name: generations
          in: query
          description: Number of ancestor generations to include (1-10)
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 5
        - name: format
          in: query
          description: Output format
          schema:
            type: string
            enum: [json, text]
            default: json
      responses:
        '200':
          description: Ahnentafel report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AhnentafelResponse'
            text/plain:
              schema:
                type: string
                description: Plain text formatted report
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /search:
    get:
      operationId: searchPersons
      summary: Search for persons
      tags: [search]
      parameters:
        - $ref: '#/components/parameters/branchScope'
        - name: q
          in: query
          description: Search query (name)
          schema:
            type: string
        - name: fuzzy
          in: query
          description: Enable fuzzy matching for spelling variations
          schema:
            type: boolean
            default: false
        - name: soundex
          in: query
          description: Enable Soundex phonetic matching for name variants
          schema:
            type: boolean
            default: false
        - name: birth_date_from
          in: query
          description: Filter by birth date on or after this date
          schema:
            type: string
            format: date
        - name: birth_date_to
          in: query
          description: Filter by birth date on or before this date
          schema:
            type: string
            format: date
        - name: death_date_from
          in: query
          description: Filter by death date on or after this date
          schema:
            type: string
            format: date
        - name: death_date_to
          in: query
          description: Filter by death date on or before this date
          schema:
            type: string
            format: date
        - name: birth_place
          in: query
          description: Filter by birth place (partial match)
          schema:
            type: string
        - name: death_place
          in: query
          description: Filter by death place (partial match)
          schema:
            type: string
        - name: sort
          in: query
          description: Sort results by field
          schema:
            type: string
            enum: [relevance, name, birth_date, death_date]
            default: relevance
        - name: order
          in: query
          description: Sort order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/limitParam'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
        '400':
          $ref: '#/components/responses/BadRequest'

  /browse/surnames:
    get:
      operationId: browseSurnames
      summary: Get surname index with counts
      description: |
        Returns an alphabetical index of surnames with person counts. With
        `?branch=` the index is built from that branch's isolated view; omit it
        for the mainline.
      tags: [browse]
      parameters:
        - $ref: '#/components/parameters/branchScope'
        - name: letter
          in: query
          description: Filter surnames by starting letter (A-Z)
          schema:
            type: string
            pattern: '^[A-Z]$'
      responses:
        '200':
          description: Surname index or surnames list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurnameIndexResponse'

  /browse/surnames/{surname}/persons:
    parameters:
      - name: surname
        in: path
        required: true
        description: The surname to get people for
        schema:
          type: string
    get:
      operationId: getPersonsBySurname
      summary: Get persons with a specific surname
      description: |
        Returns the people carrying the surname. With `?branch=` the results come
        from that branch's isolated view; omit it for the mainline.
      tags: [browse]
      parameters:
        - $ref: '#/components/parameters/branchScope'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
      responses:
        '200':
          description: List of persons with the surname
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonList'

  /browse/places:
    get:
      operationId: browsePlaces
      summary: Get place hierarchy with counts
      description: |
        Returns hierarchical place data (Country > State > County > City). With
        `?branch=` the places and counts are derived from that branch's isolated
        view; omit it for the mainline.
      tags: [browse]
      parameters:
        - $ref: '#/components/parameters/branchScope'
        - name: parent
          in: query
          description: Parent place to get children for (empty for top-level)
          schema:
            type: string
      responses:
        '200':
          description: Place hierarchy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceIndexResponse'

  /browse/places/{place}/persons:
    parameters:
      - name: place
        in: path
        required: true
        description: The place to get people for
        schema:
          type: string
    get:
      operationId: getPersonsByPlace
      summary: Get persons associated with a place
      description: |
        Returns the people associated with the place. With `?branch=` the results
        come from that branch's isolated view; omit it for the mainline.
      tags: [browse]
      parameters:
        - $ref: '#/components/parameters/branchScope'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
      responses:
        '200':
          description: List of persons associated with the place
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonList'

  /browse/cemeteries:
    get:
      operationId: browseCemeteries
      summary: Get cemetery/burial place index with counts
      description: |
        Returns unique burial and cremation places with person counts. With
        `?branch=` the counts are aggregated from that branch's isolated view of
        the burial and cremation life events (a person the branch deleted takes
        their life events with them), so they agree with `getPersonsByCemetery`
        on the same branch; omit it for the mainline.
      tags: [browse]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      responses:
        '200':
          description: Cemetery/burial place index
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CemeteryIndexResponse'

  /browse/cemeteries/{place}/persons:
    parameters:
      - name: place
        in: path
        required: true
        description: The cemetery or burial place to get people for
        schema:
          type: string
    get:
      operationId: getPersonsByCemetery
      summary: Get persons buried or cremated at a place
      description: |
        Returns the people buried or cremated at the place. With `?branch=` both
        the burial and cremation life events and the persons they belong to are
        read from that branch's isolated view; omit the parameter for the
        mainline.
      tags: [browse]
      parameters:
        - $ref: '#/components/parameters/branchScope'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
      responses:
        '200':
          description: List of persons buried or cremated at the place
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonList'

  /map/locations:
    get:
      operationId: getMapLocations
      summary: Get geographic locations for map visualization
      description: |
        Returns aggregated birth and death locations with coordinates for map
        display. With `?branch=` the locations are aggregated from that branch's
        isolated view; omit it for the mainline.
      tags: [browse]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      responses:
        '200':
          description: Geographic location data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapLocationsResponse'

  /browse/brick-walls:
    get:
      operationId: getBrickWalls
      summary: List brick wall research blocks
      description: |
        Returns the brick wall research blocks. `?branch=` is NOT accepted here
        and is silently ignored if supplied: brick walls are not event-sourced,
        so there is no branch overlay to read
        ([#761](https://github.com/cacack/my-family/issues/761)) and the response
        is always the mainline.
      tags: [browse]
      parameters:
        - name: include_resolved
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Brick wall list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrickWallsResponse'

  /persons/{id}/brick-wall:
    parameters:
      - $ref: '#/components/parameters/personId'
    put:
      operationId: setPersonBrickWall
      summary: Mark person as a brick wall
      description: |
        Marks the person as a brick wall. `?branch=` is NOT accepted here and is
        silently ignored if supplied: brick walls are not event-sourced, so there
        is no branch overlay to write to
        ([#761](https://github.com/cacack/my-family/issues/761)) — the mark always
        lands on the mainline and is visible from every branch.
      tags: [persons]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: Description of the research block
      responses:
        '204':
          description: Brick wall set
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: resolvePersonBrickWall
      summary: Resolve a brick wall (mark as broken through)
      description: |
        Resolves the person's brick wall. `?branch=` is NOT accepted here and is
        silently ignored if supplied: brick walls are not event-sourced, so there
        is no branch overlay to write to
        ([#761](https://github.com/cacack/my-family/issues/761)) — the resolution
        always lands on the mainline and is visible from every branch.
      tags: [persons]
      responses:
        '204':
          description: Brick wall resolved
        '404':
          $ref: '#/components/responses/NotFound'

  /gedcom/import:
    post:
      operationId: importGedcom
      summary: Import a GEDCOM file
      tags: [gedcom]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: GEDCOM file to import
      responses:
        '200':
          description: Import completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '400':
          description: Invalid GEDCOM file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /gedcom/export:
    get:
      operationId: exportGedcom
      summary: Export all data as GEDCOM
      tags: [gedcom]
      parameters:
        - name: version
          in: query
          description: >-
            GEDCOM version to emit. When omitted, defaults to 5.5 and is
            automatically upgraded to 7.0 if the data uses 7.0-only features.
          schema:
            type: string
            enum: ['5.5', '5.5.1', '7.0']
      responses:
        '200':
          description: GEDCOM file
          content:
            application/x-gedcom:
              schema:
                type: string
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="export.ged"
        '400':
          $ref: '#/components/responses/BadRequest'

  /gedcom/export/preview:
    get:
      operationId: previewGedcomExport
      summary: Preview a GEDCOM export conversion and report data loss
      description: >-
        Reports what would change if the data were exported at the given GEDCOM
        version, without producing a file. Use it to warn about data loss before
        downloading a downgraded export. This builds the full export document
        server-side (the same cost as a real export), so call it on demand — e.g.
        when the user changes the target version — rather than reactively on every
        keystroke.
      tags: [gedcom]
      parameters:
        - name: version
          in: query
          description: >-
            GEDCOM version to preview. When omitted, defaults to 5.5 and is
            automatically upgraded to 7.0 if the data uses 7.0-only features.
          schema:
            type: string
            enum: ['5.5', '5.5.1', '7.0']
      responses:
        '200':
          description: Conversion preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportPreview'
        '400':
          $ref: '#/components/responses/BadRequest'

  /history:
    get:
      operationId: listHistory
      summary: List global change history
      tags: [history]
      description: |
        The mainline's change log, oldest first. Every event type is either
        mapped to an entry or deliberately excluded (snapshot markers, GEDCOM
        import records, merge-resume records - see
        docs/HISTORY-EVENT-TYPES.md), and the exclusion is applied in the store
        before pagination, so `total` and `has_more` describe exactly the set
        `items` is paged from. A research branch's own edits are not listed:
        they are not part of the mainline until a merge replays them. A
        branch's lifecycle is: `branch` entries record when it was created,
        merged (with the merge note) or deleted.

        A merge's replayed changes are listed at the time of the merge, not
        when they were made on the branch, and carry `merged_from`; the `from`
        and `to` window selects them by that time too.
      parameters:
        - name: entity_type
          in: query
          description: |
            Filter by entity type - the `ChangeEntry.entity_type` vocabulary.
            Applied in the store before pagination, so `total` counts only the
            matching entries.
          schema:
            type: string
            enum: [person, family, source, citation, media, note, submitter, repository, association, life_event, attribute, lds_ordinance, evidence_analysis, evidence_conflict, research_log, proof_summary, branch]
        - name: from
          in: query
          description: Start date/time for history (ISO 8601)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: End date/time for history (ISO 8601)
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
      responses:
        '200':
          description: Change history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeHistoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /persons/{id}/history:
    parameters:
      - $ref: '#/components/parameters/personId'

    get:
      operationId: getPersonHistory
      summary: Get change history for a person
      tags: [history]
      description: |
        Returns the person's change history, oldest first. Without `?branch=` it is
        the mainline's history of the person's stream.

        With `?branch=` it is the history of the person *as that branch sees it*
        (ADR-005): the branch's own events for the stream plus the mainline
        events its view inherits. The overlay is live, so until the branch first
        writes the person every mainline event is inherited; from that write on,
        the branch keeps its own copy and later mainline events are not part of
        its view (they surface in the branch compare and at merge). Each entry
        carries `origin` (`branch` or `main`). A person that exists only on the
        branch has only branch entries; one the branch deleted is not found.
      parameters:
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
        - $ref: '#/components/parameters/branchScope'
      responses:
        '200':
          description: Person change history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeHistoryResponse'
        '404':
          $ref: '#/components/responses/NotFound'

