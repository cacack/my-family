        Creates an evidence analysis. With `?branch=` it is created on that
        branch only, and the automatic evidence-conflict check compares it with
        the analyses the branch sees (a conflict it records lives on the branch).
      tags: [evidence-analyses]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceAnalysisCreate'
      responses:
        '201':
          description: Evidence analysis created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceAnalysis'
        '400':
          $ref: '#/components/responses/BadRequest'

