    # LDS Ordinance schemas
    LDSOrdinanceType:
      type: string
      enum: [BAPL, CONL, ENDL, SLGC, SLGS]
      description: |
        LDS temple ordinance type:
        - BAPL: Baptism (LDS)
        - CONL: Confirmation (LDS)
        - ENDL: Endowment
        - SLGC: Sealing to Parents
        - SLGS: Sealing to Spouse (family level)

    LDSOrdinance:
      type: object
      required: [id, type, type_label, version, updated_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/LDSOrdinanceType'
        type_label:
          type: string
          description: Human-readable ordinance type label
        person_id:
          type: string
          format: uuid
          description: Person ID (for individual ordinances BAPL, CONL, ENDL, SLGC)
        person_name:
          type: string
          description: Person's full name (denormalized for display)
        family_id:
          type: string
          format: uuid
          description: Family ID (for spouse sealing SLGS)
        date:
          $ref: '#/components/schemas/GenDate'
        place:
          type: string
          description: Location where ordinance was performed
        temple:
          type: string
          description: Temple code (GEDCOM TEMP tag)
        status:
          type: string
          description: Status (COMPLETED, BIC, CHILD, EXCLUDED, etc.)
        version:
          type: integer
          format: int64
        updated_at:
          type: string
          format: date-time

    LDSOrdinanceCreate:
      type: object
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/LDSOrdinanceType'
        person_id:
          type: string
          format: uuid
          description: Required for individual ordinances (BAPL, CONL, ENDL, SLGC)
        family_id:
          type: string
          format: uuid
          description: Required for spouse sealing (SLGS)
        date:
          type: string
          description: Date string in GEDCOM format
        place:
          type: string
        temple:
          type: string
          description: Temple code
        status:
          type: string
          description: Ordinance status

    LDSOrdinanceUpdate:
      type: object
      required: [version]
      properties:
