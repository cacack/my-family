      description: |
        Case-insensitive substring search over source titles and authors. With
        `?branch=` the search runs over that branch's isolated view: a source
        the branch retitled matches its branch title only, and one the branch
        deleted never matches.
      tags: [sources]
      parameters:
        - $ref: '#/components/parameters/branchScope'
        - name: q
          in: query
          required: true
          description: Search query
          schema:
            type: string
            minLength: 2
        - $ref: '#/components/parameters/limitParam'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceSearchResults'
        '400':
          $ref: '#/components/responses/BadRequest'

  /sources/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: getSource
      summary: Get a source by ID
      description: |
        Returns the source with its citations and external identifiers. With
        `?branch=` all three are read from that branch's isolated view.
      tags: [sources]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      responses:
        '200':
          description: Source details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceDetail'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      operationId: updateSource
      summary: Update a source
      tags: [sources]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceUpdate'
      responses:
        '200':
          description: Source updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      operationId: deleteSource
      summary: Delete a source
      description: |
        Deletes a source that has no citations. With `?branch=` the source is
        deleted on that branch only (the mainline keeps it), and "has no
        citations" is judged by the branch's view.
      tags: [sources]
      parameters:
        - $ref: '#/components/parameters/branchScope'
        - $ref: '#/components/parameters/versionParam'
      responses:
        '204':
          description: Source deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /sources/{id}/citations:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: getCitationsForSource
      summary: Get citations for a source
      tags: [sources]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      responses:
        '200':
          description: List of citations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitationList'
        '404':
          $ref: '#/components/responses/NotFound'

  # Citation endpoints
  /citations:
    post:
      operationId: createCitation
      summary: Create a new citation
      description: |
        Creates a citation of a source. With `?branch=` the source must exist on
        that branch, the citation is created on the branch only, and its
        denormalized `source_title` is the branch's title for the source.
      tags: [citations]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CitationCreate'
      responses:
        '201':
          description: Citation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Citation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Source or fact owner not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /citations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: getCitation
      summary: Get a citation by ID
      tags: [citations]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      responses:
        '200':
          description: Citation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Citation'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      operationId: updateCitation
      summary: Update a citation
      tags: [citations]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CitationUpdate'
      responses:
        '200':
          description: Citation updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Citation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      operationId: deleteCitation
      summary: Delete a citation
      tags: [citations]
      parameters:
        - $ref: '#/components/parameters/branchScope'
        - $ref: '#/components/parameters/versionParam'
      responses:
        '204':
          description: Citation deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /persons/{id}/citations:
    parameters:
      - $ref: '#/components/parameters/personId'

    get:
      operationId: getCitationsForPerson
      summary: Get citations for a person
      tags: [citations]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      responses:
        '200':
          description: List of citations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitationList'
        '404':
          $ref: '#/components/responses/NotFound'

  /persons/{id}/names:
    parameters:
      - $ref: '#/components/parameters/personId'

    get:
      operationId: getPersonNames
      summary: Get all names for a person
      description: Returns all name variants for a person (birth name, married name, aliases, etc.)
      tags: [persons]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      responses:
        '200':
          description: List of person names
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonNameList'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      operationId: addPersonName
      summary: Add a name to a person
      description: |
        Add a new name variant to a person. If is_primary is true, the existing
        primary name will be demoted to non-primary.
      tags: [persons]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonNameCreate'
      responses:
        '201':
          description: Name added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonName'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /persons/{id}/names/{nameId}:
    parameters:
      - $ref: '#/components/parameters/personId'
      - name: nameId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    put:
      operationId: updatePersonName
      summary: Update a person's name
      description: |
        Update an existing name variant. If is_primary is set to true, the existing
        primary name will be demoted to non-primary.
      tags: [persons]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonNameUpdate'
      responses:
        '200':
          description: Name updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonName'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      operationId: deletePersonName
      summary: Remove a name from a person
      description: |
        Remove a name variant from a person. Cannot delete the last remaining name
        or the primary name (must transfer primary status first).
      tags: [persons]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      responses:
        '204':
          description: Name removed
        '400':
          description: Cannot delete last name or primary name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

