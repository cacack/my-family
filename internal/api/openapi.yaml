          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributesExportResponse'

  /export/estimate:
    get:
      operationId: getExportEstimate
      summary: Get export size estimation
      description: |
        Returns an estimate of the export file size and record counts.
        Useful for showing users expected download size and determining
        whether to use streaming progress for large exports.
      tags: [export]
      responses:
        '200':
          description: Export estimation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportEstimate'

  # Quality and Statistics endpoints
  /quality/overview:
    get:
      operationId: getQualityOverview
      summary: Get aggregate quality metrics
      description: |
        Returns overall data quality metrics across all persons in the scoped
        view of the tree, computed server-side over every person (never a page).
      tags: [quality]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      responses:
        '200':
          description: Quality overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityOverview'

  /quality/persons/{id}:
    parameters:
      - $ref: '#/components/parameters/personId'

    get:
      operationId: getPersonQuality
      summary: Get quality score for a person
      description: Returns data completeness score and issues for a specific person
      tags: [quality]
      responses:
        '200':
          description: Person quality metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonQuality'
        '404':
          $ref: '#/components/responses/NotFound'

  /quality/report:
    get:
      operationId: getQualityReport
      summary: Get full quality report
      description: Returns comprehensive data quality metrics including completeness, coverage, and aggregated issues
      tags: [quality]
      responses:
        '200':
          description: Full quality report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityReport'

  /quality/validation:
    get:
      operationId: getValidationIssues
      summary: Get validation issues
      description: |
        Returns date logic and reference validation issues categorized by
        severity. Supports pagination so a large tree does not produce an
        unbounded response. The error/warning/info counts always reflect the
        full unfiltered, unpaginated issue set.
      tags: [quality]
      parameters:
        - name: severity
          in: query
          description: Filter by severity level
          schema:
            type: string
            enum: [error, warning, info]
        - name: limit
          in: query
          description: Maximum number of issues to return (post-severity-filter)
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          description: Number of issues to skip (post-severity-filter)
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Validation issues
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationIssuesResponse'

  /persons/duplicates:
    get:
      operationId: getPersonsDuplicates
      summary: Find potential duplicate persons
      description: Returns pairs of persons that may be duplicates based on name, date, and place matching
      tags: [quality]
      parameters:
        - name: limit
          in: query
          description: Maximum number of duplicate pairs to return
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          description: Number of duplicate pairs to skip
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Potential duplicate pairs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicatesResponse'

  /persons/merge:
    post:
      operationId: mergePersons
      summary: Merge two person records
      description: |
        Merges two person records, consolidating data from the merged person into the survivor.
        The merged person is deleted after the merge. All relationships (families, citations,
        alternate names, events, media) are transferred to the survivor.

        With `branch`, the merge is made on that research branch only (#834): both persons are
        read through the branch's view, the survivor and the versions are checked there, and the
        mainline is untouched until the branch itself is merged.
      tags: [persons]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergePersonsRequest'
      responses:
        '200':
          description: Persons merged successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergePersonsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Conflict - version mismatch, circular merge (ancestor/descendant relationship),
            or both persons are children in different families
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /persons/duplicates/{person1Id}/{person2Id}/dismiss:
    parameters:
      - name: person1Id
        in: path
        required: true
        description: First person ID in the duplicate pair
        schema:
          type: string
          format: uuid
      - name: person2Id
        in: path
        required: true
        description: Second person ID in the duplicate pair
        schema:
          type: string
          format: uuid
    post:
      operationId: dismissDuplicate
      summary: Dismiss a duplicate pair as false positive
      description: |
        Marks a duplicate pair as a false positive. The pair will not be returned
        in future duplicate detection results.
      tags: [quality]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DismissDuplicateRequest'
      responses:
        '204':
          description: Duplicate pair dismissed
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /persons/merge/batch:
    post:
      operationId: batchMergePersons
      summary: Batch merge multiple duplicate pairs
      description: |
        Merges multiple duplicate pairs in a single batch operation.
        Each pair is processed independently; partial failures are reported
        in the response. Successfully merged pairs continue processing even
        if earlier pairs fail. With `branch`, every merge is made on that
        research branch only, as for a single merge.
      tags: [persons]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchMergeRequest'
      responses:
        '200':
          description: Batch operation completed (check results for individual outcomes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchMergeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /persons/duplicates/dismiss/batch:
    post:
      operationId: batchDismissDuplicates
      summary: Batch dismiss multiple duplicate pairs
      description: |
        Dismisses multiple duplicate pairs as false positives in a single operation.
        Each pair is processed independently; partial failures are reported in the response.
      tags: [quality]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchDismissRequest'
      responses:
        '200':
          description: Batch operation completed (check results for individual outcomes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchDismissResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /statistics:
    get:
      operationId: getStatistics
      summary: Get tree-wide statistics
      description: Returns aggregate statistics about the family tree
      tags: [statistics]
      responses:
        '200':
          description: Tree statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statistics'

  /analytics/discovery:
    get:
      operationId: getDiscoveryFeed
      summary: Get discovery feed suggestions
      description: Returns prioritized research suggestions based on data quality analysis
      tags: [quality]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Discovery feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryFeedResponse'

  # Snapshot endpoints

  /snapshots:
    get:
      operationId: listSnapshots
      summary: List the snapshots of the mainline or a branch
      description: |
        Returns the research milestone snapshots marked on the requested scope,
        newest first. A snapshot marks `(branch_id, position)` (ADR-005): the
        mainline's list holds mainline snapshots only, and a branch's list holds
        that branch's snapshots only.
      tags: [snapshots]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      responses:
        '200':
          description: List of snapshots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotList'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      operationId: createSnapshot
      summary: Create a new snapshot
      description: |
        Creates a snapshot marking the current position of the event log in the
        requested scope's view: on the mainline by default, or on the branch
        named by `?branch=`.
      tags: [snapshots]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapshotCreate'
            example:
              name: "Pre-DNA results"
              description: "Research state before DNA test results arrived"
      responses:
        '201':
          description: Snapshot created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /snapshots/{id}:
    parameters:
      - $ref: '#/components/parameters/snapshotId'

    get:
      operationId: getSnapshot
      summary: Get a snapshot by ID
      description: A snapshot marked on another branch than the requested scope is not found.
      tags: [snapshots]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      responses:
        '200':
          description: Snapshot details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      operationId: deleteSnapshot
      summary: Delete a snapshot
      description: |
        Removes the snapshot record (events in the store remain untouched). A
        snapshot marked on another branch than the requested scope is not found.
      tags: [snapshots]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      responses:
        '204':
          description: Snapshot deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /snapshots/{id}/compare-current:
    parameters:
      - $ref: '#/components/parameters/snapshotId'

    get:
      operationId: compareSnapshotToCurrent
      summary: Compare a snapshot to the current state
      description: |
        Returns the changes recorded between the snapshot's position and the
        current head of the event log ("what changed since this milestone?"),
        in the requested scope's view: the mainline's own changes, or on a
        branch the branch's view (its own changes plus the mainline changes it
        inherits, each labelled with `origin` — ADR-005). The snapshot must be
        marked on the requested scope; one marked on another branch is refused
        with 409 `snapshot_branch_mismatch`.

        `until` bounds the comparison at a log position instead of the head, so
        a range can be pinned after the log has moved on - for instance from a
        merge's pre-merge snapshot to the last change the merge replayed
        (`MergeRecord.replayed_through_position`), which lists exactly what the
        merge changed. An `until` past the head runs to the head; one before the
        snapshot is a 400.
      tags: [snapshots]
      parameters:
        - $ref: '#/components/parameters/branchScope'
        - name: until
          in: query
          required: false
          description: |
            The last log position to include. Defaults to the current head.
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: Comparison result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotCurrentComparisonResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The snapshot is marked on another branch (`snapshot_branch_mismatch`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /snapshots/{id1}/compare/{id2}:
    parameters:
      - name: id1
        in: path
        required: true
        description: First snapshot ID
        schema:
          type: string
          format: uuid
      - name: id2
        in: path
        required: true
        description: Second snapshot ID
        schema:
          type: string
          format: uuid

    get:
      operationId: compareSnapshots
      summary: Compare two snapshots
      description: |
        Returns the list of changes (events) between two snapshot positions, in
        the requested scope's view: the mainline's own changes, or on a branch
        the branch's view (its own changes plus the mainline changes it
        inherits, each labelled with `origin` — ADR-005). Both snapshots must be
        marked on the requested scope; comparing snapshots from different
        branches is refused with 409 `snapshot_branch_mismatch`. To compare a
        snapshot with the current state, use `/snapshots/{id}/compare-current`.
      tags: [snapshots]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      responses:
        '200':
          description: Comparison result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotComparisonResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The snapshots are marked on different branches (`snapshot_branch_mismatch`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Branch endpoints (ADR-005)

  /branches:
    get:
      operationId: listBranches
      summary: List all branches
      description: |
        Returns every branch in the registry, newest first, including terminal
        (merged/archived) ones.

        With `include_drift=true`, each **active** branch also carries `drift`:
        how far the mainline has moved underneath it since it forked (see
        `GET /branches/{id}/drift`). Every branch's counts come from one
        set-based store query, not one per branch. Terminal branches never
        carry `drift` — they accept no further changes, so there is nothing
        left for main to move under.
      tags: [branches]
      parameters:
        - name: include_drift
          in: query
          required: false
          description: Attach the "main moved" counts to each active branch
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of branches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchList'
        '503':
          $ref: '#/components/responses/BranchesUnavailable'

    post:
      operationId: createBranch
      summary: Create a new branch
      description: |
        Forks a new line of research off the current head of the mainline. The
        fork point is captured as `base_position`, the same base-pointer concept
        a snapshot uses.
      tags: [branches]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchCreate'
            example:
              name: "Maternal Smith line"
              description: "Testing the theory that Mary Smith is the daughter of John"
              hypothesis: "Was Mary Smith (b. 1842) the daughter of John Smith of Albany?"
              outcome: open
      responses:
        '201':
          description: Branch created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400':
          description: |
            Invalid request. `validation_error` for a field that breaks its
            limits; `invalid_reference` when a subject or proof summary does
            not exist on the mainline (a new branch's view is the mainline).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/BranchesUnavailable'

  /branches/{id}:
    parameters:
      - $ref: '#/components/parameters/branchId'

    get:
      operationId: getBranch
      summary: Get a branch by ID
      description: |
        Returns the branch with its research record. Subjects carry their
        display `name` and `proof_summaries` lists the linked proof summaries,
        both resolved through the branch's view while it is active and through
        the mainline once it is merged or archived. A subject or proof summary
        that no longer exists keeps its id but has no name / no entry.
      tags: [branches]
      responses:
        '200':
          description: Branch details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/BranchesUnavailable'

    patch:
      operationId: updateBranch
      summary: Edit a branch's description and research record
      description: |
        Partial update (#835): every field is optional, an absent field is left
        as it is, and a present one replaces the stored value (an empty string
        or empty array clears it). At least one field is required.

        - An `active` branch accepts every field.
        - A `merged` branch accepts only `outcome`, so the verdict can be
          recorded once the merge has landed (typically `proved`). Its question,
          subjects and evidence stay as they were merged; changing them is a
          409 `branch_field_locked`.
        - An `archived` branch accepts nothing (409 `branch_not_active`).

        Subjects and proof summaries the update adds must exist on the branch's
        own view (its overlay: a person created on the branch counts, one
        deleted on it does not); otherwise 400 `invalid_reference`. Ids already
        on the branch are not re-checked.

        The edit is recorded as a `BranchUpdated` event on the branch's own
        stream. It is research metadata: it never appears among the branch's
        changes in a comparison and is never replayed onto the mainline by a
        merge. An update that changes nothing records no event.
      tags: [branches]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchUpdate'
            example:
              hypothesis: "Was Mary Smith (b. 1842) the daughter of John Smith of Albany?"
              outcome: proved
      responses:
        '200':
          description: The branch as it stands after the edit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400':
          description: |
            Invalid request: `validation_error` (a field breaks its limits, or
            no field was given) or `invalid_reference` (a subject or proof
            summary is not visible on the branch).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The branch cannot take this edit: `branch_not_active` (archived),
            `branch_field_locked` (a merged branch accepts only `outcome`) or
            `branch_changed` (the branch was edited, merged or deleted by
            another request while this edit was being applied; nothing was
            recorded — reload the branch and retry).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/BranchesUnavailable'

    delete:
      operationId: deleteBranch
      summary: Close (archive) a branch without recording why
      description: |
        Closes a branch without recording an outcome or a reason. A verdict
        the branch already holds (`disproved`, `inconclusive`, `superseded`,
        `proved`) is kept; a branch still `open` is recorded as `abandoned`.
        Kept for existing clients; prefer `POST /branches/{id}/close`.

        The branch record and every event it produced are **retained** — the
        event log is append-only (invariant ES-002). What is removed is the
        branch's read-model overlay: after this call the branch's `status` is
        `archived` and its isolated view no longer exists, so `?branch=` reads
        against it return 404. Its research stays readable through
        `GET /branches/{id}/research`.

        Only an `active` branch can be closed; a `merged` or already `archived`
        branch returns 409.
      tags: [branches]
      responses:
        '204':
          description: Branch archived
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Branch is not active (already merged or archived)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/BranchesUnavailable'

  /branches/{id}/close:
    parameters:
      - $ref: '#/components/parameters/branchId'

    post:
      operationId: closeBranch
      summary: Close a branch without merging, recording why
      description: |
        Closes an `active` branch (#836) and records the outcome its research
        reached — `disproved`, `inconclusive`, `superseded` or `abandoned` —
        with an optional reason. Both are carried by the branch's
        `BranchDeleted` event and shown on the branch (`outcome`,
        `close_reason`, `closed_at`).

        The branch becomes `archived`: its events are retained (ES-002) and its
        read-model overlay is purged, so `?branch=` reads against it return
        404. Its research logs (including searches that found nothing),
        evidence analyses and proof summaries remain readable through
        `GET /branches/{id}/research`, which rebuilds them from the events, and
        its research logs can be copied to the mainline with
        `POST /branches/{id}/research-logs/promote`.
      tags: [branches]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchCloseRequest'
      responses:
        '200':
          description: The closed branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400':
          description: '`validation_error`: the outcome is not a close outcome, or the reason is too long'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `branch_not_active` (already merged or closed) or `branch_changed`
            (another request changed the branch while it was being closed;
            nothing was recorded).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/BranchesUnavailable'

  /branches/{id}/research:
    parameters:
      - $ref: '#/components/parameters/branchId'

    get:
      operationId: getBranchResearch
      summary: Read a branch's research, rebuilt from its events
      description: |
        Returns the research logs, evidence analyses and proof summaries the
        branch recorded, each as the branch left it (#836). They are rebuilt
        from the branch's own events rather than read from its overlay, so the
        call works on a closed or merged branch, whose overlay has been purged.
        Read-only: nothing is written.
      tags: [branches]
      responses:
        '200':
          description: The branch's research archive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchResearchArchive'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/BranchesUnavailable'

  /branches/{id}/research-logs/promote:
    parameters:
      - $ref: '#/components/parameters/branchId'

    post:
      operationId: promoteBranchResearchLogs
      summary: Copy a closed branch's research logs to the mainline
      description: |
        Copies research logs a closed branch recorded to the mainline (#836),
        so its searches — especially the ones that found nothing — stay part of
        the mainline's research record. Each promoted log keeps its id and gets
        a note naming the branch, the outcome it was closed with and the
        reason.

        A log is skipped (and listed in `skipped` with the reason) when it is a
        mainline entry the branch only edited, when it is already on the
        mainline, or when its subject does not exist on the mainline — a
        promotion never creates a dangling reference. Promoting again is safe:
        a log promoted before is reported as `already_promoted`, including one
        deleted on the mainline since, which is not restored.

        Only a closed (`archived`) branch's logs are promoted; an active
        branch's reach the mainline by merging.
      tags: [branches]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoteResearchLogsRequest'
      responses:
        '200':
          description: What was promoted and what was skipped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoteResearchLogsResult'
        '400':
          description: '`validation_error`: `log_ids` names more than 500 logs'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`branch_not_closed`: the branch is active or merged'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/BranchesUnavailable'

  /branches/{id}/drift:
    parameters:
      - $ref: '#/components/parameters/branchId'

    get:
      operationId: getBranchDrift
      summary: Count how far the mainline has moved under a branch
      description: |
        Branches are **live overlays**, not frozen copies (ADR-005): every
        entity the branch has not changed shows the mainline's *current*
        data, so main's edits after the fork show through. This returns a
        cheap indicator of that movement without running a full compare:

        - `main_change_count`: mainline changes since the fork, on any entity.
        - `main_change_count_on_branch_entities`: the subset on entities this
          branch changed — the ones `GET /branches/{id}/compare` lists under
          main's changes, where the two lines of research can diverge.

        Research-metadata events (branch and snapshot lifecycle) are not
        genealogy changes and are not counted. Each count is capped; when a
        cap is hit `has_more` is true and the count is a lower bound.
      tags: [branches]
      responses:
        '200':
          description: Drift counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchDrift'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/BranchesUnavailable'

  /branches/{id}/compare:
    parameters:
      - $ref: '#/components/parameters/branchId'

    get:
      operationId: compareBranch
      summary: Compare a branch against the mainline
      description: |
        Returns the changes made on the branch since it forked, alongside the
        changes made on `main` after the fork point to the same streams the
        branch touched.

        `overlapping_stream_ids` is a divergence **hint** — the entities both
        sides changed. `conflicts` is the *verdict*: the subset of that overlap
        where the two sides made incompatible changes and a human has to pick a
        winner. An entity can overlap without conflicting (both sides changed
        different fields, or made the same change).

        This is the one call the merge review UI needs: it returns the diff and
        the conflict verdict together, so there is no separate merge-preview
        endpoint to keep in sync.

        Terminal (merged or archived) branches compare normally: their events
        remain in the append-only log, so the historical diff is still returned.
        A merged branch's compare also carries `merge_record` - what the merge
        decided, as recorded then - and leaves the merge's own replayed copies
        of the branch's changes out of the mainline side
        (`replayed_change_count`).
      tags: [branches]
      responses:
        '200':
          description: Comparison result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchComparisonResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/BranchesUnavailable'

  /branches/{id}/merge:
    parameters:
      - $ref: '#/components/parameters/branchId'

    post:
      operationId: mergeBranch
      summary: Merge a branch into the mainline
      description: |
        Promotes a branch's research onto `main` by replaying its events there
        with their original payloads and timestamps, then marking the branch
        `merged`. The branch's events are never rewritten or removed — the log
        is append-only (invariants ES-002, BR-004), so a merge only ever *adds*
        events to `main`.

        **No partial merges are requestable.** Partial merge and cherry-pick are
        deliberately out of scope (ADR-005 §Merge); the only supported way to
        leave an entity behind is a `main` resolution for it, which drops that
        entity's branch changes.

        **This is not a transactional guarantee, and one failure mode is not
        all-or-nothing.** Every refusal above (`400`, `404`, `409`) happens
        before anything is written. But the branch is claimed *before* the
        replay onto `main` begins, and the two are not one transaction — the
        event store and the read model have no shared transaction. If the replay
        then fails partway, the response is `500 merge_partially_applied`: the
        branch is already `merged` and `main` carries only some of its entities.
        **Do not retry that request** — a retry gets `409 branch_not_active`,
        which is not evidence the merge completed. Call
        `GET /branches/{id}/compare` (it still works on a merged branch, reading
        the event log rather than the branch's view) to see what did and did not
        land, and finish the merge with `POST /branches/{id}/merge/resume`,
        which replays only what is not yet on `main`.

        **Every detected conflict must carry a resolution.** Call
        `GET /branches/{id}/compare` first: its `conflicts` array is the
        authoritative list. Send one entry in `resolutions` for each conflicting
        `stream_id`, choosing `branch` (replay the branch's version onto main) or
        `main` (keep main's version and discard the branch's changes to that
        entity). If any conflict is left undecided the merge is refused with
        `409 merge_conflicts` and **nothing is written** — the response carries
        the full conflict list so the client can render the review.

        **The verdict this call acts on is computed here, not carried over from
        `compare`.** This endpoint re-runs conflict detection itself and ignores
        whatever `compare` told the client earlier, so the client's compare-time
        verdict is advisory only — a review aid, never an input. What is pinned
        is the verdict computed inside *this* request: the `main` versions it was
        derived from are recorded, then re-checked before anything is written and
        again as each entity is replayed. If `main` moves on an entity this merge
        would replay inside that window, the merge is refused with
        `409 merge_plan_stale` and **nothing is written**; the branch stays
        `active`, and retrying is the fix. The refusal is deliberately broader
        than a conflict: *any* mainline write to a replayed entity trips it, even
        one that would not have conflicted, because the alternative is
        overwriting it silently.

        **A `200` is therefore not evidence that nothing landed on your entities
        since your `compare`.** Mainline writes between `compare` and this call
        are re-planned against, not rejected — they are simply part of the
        `main` this merge was judged against. A client that needs the user to see
        such a write before it is merged over must re-`compare` and re-present the
        verdict itself; this endpoint's guarantee is only that the verdict it
        acted on describes the `main` it wrote to.

        A resolution may also name a non-conflicting stream the branch touched;
        that is how a caller excludes an entity from an otherwise clean merge.
        Naming a stream the branch never changed is a `400`, not a no-op: the
        caller and the server disagree about what is being merged.

        Exactly one merge can win. The `active → merged` transition is an atomic
        compare-and-set, so a concurrent second request gets
        `409 merge_already_claimed` having written nothing. A sequential repeat
        against an already-merged (or archived) branch gets
        `409 branch_not_active`.
      tags: [branches]
      requestBody:
        required: false
        description: |
          Optional. A merge with no note and no resolutions can be requested
          with an empty body.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchMergeRequest'
            example:
              note: "Confirmed by the 1881 census; Mary Smith is John's daughter"
              resolutions:
                - stream_id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  resolution: "branch"
      responses:
        '200':
          description: Branch merged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchMergeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The merge was refused and nothing was written. `code` says why:

            - `merge_conflicts` — at least one detected conflict has no
              resolution. The `conflicts` array is populated with the *whole*
              conflict list (not just the undecided ones) so the review UI can
              render everything at once.
            - `branch_not_active` — the branch is already `merged` or
              `archived`; terminal branches accept no further writes.
            - `merge_already_claimed` — a concurrent request won the
              `active → merged` compare-and-set. This request wrote nothing.
            - `branch_too_large` — the **branch's own** scan hit the read cap,
              so its replay set is incomplete and merging would silently promote
              only part of it. **Not retryable:** the cap is fixed and the
              branch does not shrink; promoting a subset needs partial merge
              ([#684](https://github.com/cacack/my-family/issues/684)). The
              message names the cap.
            - `main_too_far_ahead` — a scan of **the mainline** hit the read
              cap, so the conflict list is not known to be complete. The branch
              itself may be tiny: this is driven by how much has landed on main
              for the branch's entities since it forked, not by branch size.
              Reported separately from `branch_too_large` because the cause and
              the remedy differ — do not tell the user their branch is too big.
            - `merge_plan_stale` — the mainline moved on an entity this merge
              would replay, after this call's own conflict verdict was computed
              against it. That write was never compared with the branch's
              changes, so replaying over it would silently override it.
              **Retryable, and the retry is the fix:** merging again re-plans
              against the mainline as it now stands. The message carries the
              stream id of the entity that moved (not a resolved name), the
              version the plan assumed and the version the mainline is actually
              at, as free text — there is no structured field for them.
            - `merge_dangling_reference` — the replay would break a reference
              between entities. Either the mainline would end up holding a
              reference to an entity it will not have (a family partner or
              child link, or an association, naming a person that was deleted
              or merged away there or excluded by a `main` resolution; or a
              citation whose source was), or a replayed source deletion would
              also delete a mainline citation that still cites that source
              (typically one added on the mainline after the fork). Resolutions
              are per entity, but the branch's events reference each other
              across entities, so excluding one entity does not exclude the
              references to it. The message names both entities of the first
              one, and `blockers` lists **every** one by name, each with the
              one-step fix that clears it (#831). Refused rather than silently
              dropping or orphaning data. `POST /branches/{id}/merge/precheck`
              reports the same blockers for proposed resolutions without
              merging.
            - `merge_empty` — the branch has no changes of its own since it
              forked, so there is nothing to promote. Refused rather than
              recording a "merged" that promoted nothing (#828); the branch
              stays `active`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchMergeConflictError'
        '500':
          description: |
            `merge_partially_applied` — the branch was claimed and marked
            `merged`, but the replay onto `main` did not finish. This is the
            non-transactional window described above. The message names the
            stream that failed, how far the replay got, and — read this first —
            whether `main` was modified **at all**: a replay that fails on its
            first entity leaves `main` completely untouched, which needs a
            different response from a genuine half-application and is stated
            explicitly rather than left to be inferred from the counts. Do not
            retry this request either way; the branch is terminal. Finish the
            merge with `POST /branches/{id}/merge/resume`. This also covers the residual
            staleness window: the pre-merge check is not a lock, so a mainline
            write landing after it is caught by the replay's own per-stream
            version assertion — the message then says the plan went stale, but
            the branch is already claimed, which is why it is reported here and
            not as `409 merge_plan_stale`. Any other `500` is an unexpected
            error and carries the generic `internal_error` code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/BranchesUnavailable'

  /branches/{id}/merge/precheck:
    parameters:
      - $ref: '#/components/parameters/branchId'

    post:
      operationId: precheckBranchMerge
      summary: List what would block merging a branch with the proposed resolutions
      description: |
        Runs the merge's cross-entity reference checks for the given
        resolutions - the conflict decisions and exclusions the review holds -
        and returns every **merge blocker** they find, **writing nothing**
        (#831). A blocker is a reference the merge would break: a family
        partner or child link, or an association, naming a person the mainline
        will not have; a citation whose source it will not have; a media item
        or GPS research whose owner or subject it will not have; an edit of
        GPS research it no longer has; or a delete that would cascade onto a
        citation, media item or GPS research the mainline still has.

        The checks are the ones `POST /branches/{id}/merge` runs before it
        claims the branch, against the mainline as it is now, so sending the
        same resolutions to the merge returns `409 merge_dangling_reference`
        with these same `blockers` exactly when this list is non-empty (unless
        the mainline moves in between). Undecided conflicts are not blockers:
        an undecided entity is checked as if its branch changes were replayed,
        as the merge checks it.

        Each blocker carries `suggested_resolution`, the one-step change that
        clears it: `leave_out` resolves the blocker's own entity (`stream_id`)
        to `main`; `include_referenced` resolves the referenced entity
        (`referenced_id`) to `branch`. Applying one can surface another -
        leaving out a person can strand a family that links them - so
        re-check after every change.
      tags: [branches]
      requestBody:
        required: false
        description: Optional. An empty body checks a merge with no resolutions.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchMergePrecheckRequest'
      responses:
        '200':
          description: The blockers the proposed merge would be refused with (`[]` when none)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchMergePrecheckResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The branch cannot be merged whatever the resolutions, so there is
            nothing to check: `branch_not_active`, `branch_too_large`,
            `main_too_far_ahead` or `merge_empty`, as for
            `POST /branches/{id}/merge`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchMergeConflictError'
        '503':
          $ref: '#/components/responses/BranchesUnavailable'

  /branches/{id}/merge/resume:
    parameters:
      - $ref: '#/components/parameters/branchId'

    post:
      operationId: resumeBranchMerge
      summary: Finish a merge whose replay onto the mainline was interrupted
      description: |
        Completes a merge that answered `500 merge_partially_applied`: the
        branch was claimed (it is `merged`) but only some of its entities
        reached `main`. Only the branch events that are **not already on
        `main`** are replayed; nothing is rewritten or removed (ES-002).

        **What already landed is derived from `main` itself.** A replayed event
        keeps the branch event's own id, so an entity whose branch events are
        already on `main` after the merge's claim is left alone. An entity is
        always wholly replayed or not at all, because each is replayed in one
        atomic append.

        **What is left to do comes from the merge's own claim.** The merge
        recorded which entities it would replay and the `main` version its
        conflict verdict was computed against for each. A remaining entity is
        replayed automatically only if `main` is still at that version. If
        `main` moved on it since — or `main` has since deleted the entity or
        merged it into another person, or the claim predates this endpoint and
        recorded no plan, or replaying it would leave `main` referencing a
        person it no longer has (for example a family linking a child `main`
        deleted or merged away after the interruption; replaying the branch's
        edits to that child does not bring them back), or replaying it would
        break the branch's evidence (a citation left citing a source `main`
        no longer has, or a source delete that would take a citation `main`
        still has down with it) — the resume is
        refused with `409 merge_resume_needs_resolution`, **nothing is
        written**, and `pending_stream_ids` lists those entities. Review them with
        `GET /branches/{id}/compare`, then resume again with one `resolutions`
        entry for each: `branch` replays the branch's changes over `main` as it
        now stands, `main` leaves the entity as `main` has it. Only pending
        entities may be resolved; naming any other is a `400`, and so is
        `branch` for an entity `main` has deleted or merged away, since
        replaying edits onto it would restore nothing. The resolutions
        are recorded in the branch's event log before anything is replayed, so
        a later resume carries them out without asking again. A `main`
        decision is permanent: no later resume asks for, or accepts, a
        different decision on that entity. A `branch` decision holds only
        while `main` leaves the entity alone: if `main` writes to it again (or
        removes a person it references) before its replay lands, that newer
        write was never reviewed, so the entity is pending again and may be
        decided afresh.

        **The mainline read model is repaired too.** If an earlier attempt's
        append reached the log but its projection then failed, that entity is
        not replayed again; instead its missing projection is re-run from the
        log, and it is listed in `reprojected_stream_ids`. The repair never
        rolls a row back: events the row already reflects are skipped, and the
        row is checked against the log once more before the resume reports
        success. Once the replay is done, the citation count of every source
        the branch's citations touch is recounted from `main`'s citations, and
        a citation whose source needed correcting is listed there as well.

        **Idempotent.** Resuming a merge that has already finished (whether by
        the original request or an earlier resume) writes nothing and returns
        `200` with `replayed_event_count: 0`. Retrying after a `500` from this
        endpoint is safe and is the remedy.
      tags: [branches]
      requestBody:
        required: false
        description: |
          Optional. Needed only to resolve the entities a previous resume
          reported as pending.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchMergeResumeRequest'
      responses:
        '200':
          description: The merge is complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchMergeResumeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The resume was refused before writing anything — nothing was
            appended to the event log and no mainline read-model row was
            touched. `code` says why:

            - `merge_not_claimed` — the branch was never claimed for a merge
              (merge it with `POST /branches/{id}/merge` instead), or it is
              `archived`.
            - `merge_resume_needs_resolution` — at least one entity still to
              replay needs a decision; see `pending_stream_ids` and the
              operation description.
            - `merge_dangling_reference` — the resolutions given would leave
              the mainline holding a relationship to an entity it will not
              have: a `branch` resolution replaying a reference to a person,
              source, media owner or GPS research subject the mainline no
              longer has, or a delete that would cascade onto a citation or
              GPS research the mainline still has (resolve that entity to
              `main` instead), or a `main` resolution excluding an entity the
              branch created that an entity already on the mainline
              references (resolve it to `branch`). `blockers` lists every
              one by name, each with its suggested fix.
            - `branch_too_large` — the branch's replay set exceeds the read cap
              and cannot be resumed in full.
            - `merge_resume_concurrent` — another write to the branch landed
              while this resume was deciding: another resume of the same
              merge recorded its resolutions first (the entities it decided
              are no longer pending), or the branch's outcome was edited.
              Nothing was replayed; resume again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchMergeResumeError'
        '500':
          description: |
            `merge_partially_applied` — the resume itself was interrupted
            partway (during the read-model repair or the replay). Whatever it
            recorded or replayed stays; resume again to finish. Any other `500` is an unexpected error and carries the
            generic `internal_error` code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/BranchesUnavailable'

  /branches/{id}/evidence-coverage:
    parameters:
      - $ref: '#/components/parameters/branchId'

    get:
      operationId: getBranchEvidenceCoverage
      summary: List the facts a branch changed without documenting them
      description: |
        The merge review's evidence-coverage warning (#838). Lists the facts
        and relationships the branch changed - a person's name, gender,
        birth or death; a life event or attribute; a family's marriage; a
        family's partners or children - that have no evidence analysis or
        proof summary written or revised on the branch itself.

        A fact is documented by an analysis or proof summary of the same fact
        type and subject that the branch created or updated (and did not
        delete); one inherited from the mainline documents the conclusion the
        branch is changing, so it does not count. A relationship has no fact
        type, so any analysis or proof summary the branch wrote about the
        family documents it. Facts the branch created and deleted again, and
        facts about a person or family the branch deleted, are not listed.

        This is a soft warning, never a merge gate. It is computed from the
        append-only log, so a merged or archived branch still answers.
      tags: [branches]
      responses:
        '200':
          description: The branch's changed facts that have no evidence on the branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchEvidenceCoverage'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/BranchesUnavailable'

  /branches/{id}/health:
    parameters:
      - $ref: '#/components/parameters/branchId'

    get:
      operationId: getBranchHealth
      summary: List the validation issues, quality issues and duplicates a branch introduces
      description: |
        Runs the `/quality` checks - validation, per-person quality and
        duplicate detection - over the branch's view of the tree and over the
        mainline, and returns what the branch INTRODUCES: its findings that the
        mainline does not have (#838). `resolved_count` counts the mainline
        findings the branch no longer has.

        Every finding carries a `key` that is stable across the two views
        because it is built from record ids: a validation issue's code, record,
        related record and occurrence; a quality issue's person and text; a
        duplicate pair's two person ids.

        Only an active branch has a view to check: an unknown, merged or
        archived branch is `404`, as for a `?branch=` read.
      tags: [branches]
      responses:
        '200':
          description: What the branch introduces into the tree's checks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchHealth'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/BranchesUnavailable'

