  # Rollback endpoints

  /persons/{id}/restore-points:
    parameters:
      - $ref: '#/components/parameters/personId'

    get:
      operationId: getPersonRestorePoints
      summary: Get restore points for a person
      description: |
        Returns a list of versions to which the person can be rolled back.

        Rollback is mainline-only (ADR-005): with `?branch=` the request is
        refused with 409 `rollback_mainline_only` and nothing is read or written.
      tags: [rollback]
      parameters:
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
        - $ref: '#/components/parameters/branchScope'
      responses:
        '200':
          description: List of restore points
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestorePointsResponse'
              example:
                items:
                  - version: 3
                    timestamp: "2024-01-15T14:30:00Z"
                    action: updated
                    summary: "updated given_name, surname"
                  - version: 2
                    timestamp: "2024-01-15T10:00:00Z"
                    action: updated
                    summary: "updated birth_date"
                  - version: 1
                    timestamp: "2024-01-14T09:00:00Z"
                    action: created
                    summary: "created John Smith"
                total: 3
                has_more: false
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            A `?branch=` scope was supplied (`rollback_mainline_only`): restore
            points are mainline-only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /persons/{id}/rollback:
    parameters:
      - $ref: '#/components/parameters/personId'

    post:
      operationId: rollbackPerson
      summary: Rollback a person to a previous version
      description: |
        Restores the person's data to match the state at the specified version.

        Rollback is mainline-only (ADR-005): with `?branch=` the request is
        refused with 409 `rollback_mainline_only` and nothing is read or written.
      tags: [rollback]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollbackRequest'
            example:
              target_version: 2
      responses:
        '200':
          description: Rollback successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollbackResponse'
              example:
                entity_id: "123e4567-e89b-12d3-a456-426614174000"
                entity_type: "Person"
                new_version: 4
                changes:
                  given_name: "John"
                  surname: "Doe"
                message: "Person rolled back successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Cannot rollback a deleted entity; or a `?branch=` scope was supplied
            (`rollback_mainline_only`), or the branch is not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

