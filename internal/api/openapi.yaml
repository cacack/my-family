        notes:
          type: array
          items:
            $ref: '#/components/schemas/Note'
        total:
          type: integer
          description: Total number of notes
        limit:
          type: integer
        offset:
          type: integer

    # Address schema for embedded addresses
    Address:
      type: object
      description: Structured GEDCOM address (embedded in other entities)
      properties:
        line1:
          type: string
          description: First address line (ADR1)
        line2:
          type: string
          description: Second address line (ADR2)
        line3:
          type: string
          description: Third address line (ADR3)
        city:
          type: string
          description: City (CITY)
        state:
          type: string
          description: State/Province (STAE)
        postal_code:
          type: string
          description: Postal/ZIP code (POST)
        country:
          type: string
          description: Country (CTRY)
        phone:
          type: string
          description: Phone number (PHON)
        email:
          type: string
          description: Email address (EMAIL)
        fax:
          type: string
          description: Fax number (FAX)
        website:
          type: string
          description: Website URL (WWW)

    # Submitter schemas
    Submitter:
      type: object
      description: A GEDCOM SUBM (submitter) record tracking who created or submitted data
      required: [id, name, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Submitter's name
        address:
          $ref: '#/components/schemas/Address'
        phone:
          type: array
          items:
            type: string
          description: Phone numbers
        email:
          type: array
          items:
            type: string
          description: Email addresses
        language:
          type: string
          description: Preferred language
        media_id:
          type: string
          format: uuid
          description: ID of linked media (submitter photo)
        gedcom_xref:
          type: string
          description: GEDCOM cross-reference ID for round-trip support
        version:
          type: integer
          format: int64
          description: Optimistic locking version
        updated_at:
          type: string
          format: date-time

    SubmitterCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Submitter's name
          minLength: 1
          maxLength: 200
        address:
          $ref: '#/components/schemas/Address'
        phone:
          type: array
          items:
            type: string
          description: Phone numbers
        email:
          type: array
          items:
            type: string
          description: Email addresses
        language:
          type: string
          description: Preferred language
        media_id:
          type: string
          format: uuid
          description: ID of linked media (submitter photo)
