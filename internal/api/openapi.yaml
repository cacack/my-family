components:
  parameters:
    personId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    familyId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    limitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    offsetParam:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0

    versionParam:
      name: version
      in: query
      required: true
      description: Entity version for optimistic locking
      schema:
        type: integer
        format: int64

    snapshotId:
      name: id
      in: path
      required: true
      description: Snapshot UUID
      schema:
        type: string
        format: uuid

    branchId:
      name: id
      in: path
      required: true
      description: Branch UUID
      schema:
        type: string
        format: uuid

    branchScope:
      name: branch
      in: query
      required: false
      description: |
        Branch scope; omit for the mainline. Reads return the branch's isolated
        view and writes land on the branch only (ADR-005). A malformed branch id
        returns 400 at parameter binding, before the operation runs. An unknown
        branch id returns 404. Writes to a non-active (merged or archived) branch
        return 409; reads of one return 404, because its overlay rows are purged
        on archive and it therefore has no view to return.
      schema:
        type: string
        format: uuid

    noteId:
      name: id
      in: path
      required: true
      description: Note UUID
      schema:
        type: string
        format: uuid

    submitterId:
      name: id
      in: path
      required: true
      description: Submitter UUID
      schema:
        type: string
        format: uuid

    repositoryId:
      name: id
      in: path
      required: true
      description: Repository UUID
      schema:
        type: string
        format: uuid

    associationId:
      name: id
      in: path
      required: true
      description: Association UUID
      schema:
        type: string
        format: uuid

    ldsOrdinanceId:
      name: id
      in: path
      required: true
      description: LDS Ordinance UUID
      schema:
        type: string
        format: uuid

    evidenceAnalysisId:
      name: id
      in: path
      required: true
      description: Evidence Analysis UUID
      schema:
        type: string
        format: uuid

    evidenceConflictId:
      name: id
      in: path
      required: true
      description: Evidence Conflict UUID
      schema:
        type: string
        format: uuid

    researchLogId:
      name: id
      in: path
      required: true
      description: Research Log UUID
      schema:
        type: string
        format: uuid

    proofSummaryId:
      name: id
      in: path
      required: true
      description: Proof Summary UUID
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Conflict:
      description: Version conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    BranchesUnavailable:
      description: Branch registry is not configured on this server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Error code
          example: "NOT_FOUND"
        message:
          type: string
          description: Human-readable error message
          example: "Person not found"
        details:
          type: object
          additionalProperties: true

    DataLossItem:
      type: object
      required: [feature, reason]
      properties:
        feature:
          type: string
          description: Name of the feature that cannot be represented in the target version.
          example: EXID tags
        reason:
          type: string
          description: Why the feature would be lost.
          example: Tag not supported in GEDCOM 5.5.1
        affectedRecords:
          type: array
          items:
            type: string
          description: >-
            Ephemeral GEDCOM XREFs (e.g. "@I1@") of the records affected by this
            loss, assigned during export from record order. They are for display
            and debugging only and do NOT resolve back to entity IDs in this API.

    ExportPreview:
      type: object
      required: [sourceVersion, targetVersion, hasDataLoss, dataLoss]
      properties:
        sourceVersion:
          type: string
          description: The GEDCOM version the data naturally requires before any downgrade.
          example: '7.0'
        targetVersion:
          type: string
          description: The GEDCOM version that would be emitted.
          example: 5.5.1
        hasDataLoss:
          type: boolean
          description: True when downgrading to targetVersion drops one or more features.
        dataLoss:
          type: array
          items:
            $ref: '#/components/schemas/DataLossItem'
          description: Features that cannot be represented in the target version.

    ExportEstimate:
      type: object
      required:
        - person_count
        - family_count
        - source_count
        - citation_count
        - event_count
        - note_count
        - total_records
        - estimated_bytes
        - is_large_export
      properties:
        person_count:
          type: integer
          description: Number of person records
          example: 150
        family_count:
          type: integer
          description: Number of family records
          example: 50
        source_count:
          type: integer
          description: Number of source records
          example: 25
        citation_count:
          type: integer
          description: Estimated number of citations (embedded in facts)
          example: 300
        event_count:
          type: integer
          description: Estimated number of events
          example: 450
        note_count:
          type: integer
          description: Number of note records
          example: 10
        total_records:
          type: integer
          description: Total number of top-level records
          example: 235
        estimated_bytes:
          type: integer
          format: int64
          description: Estimated file size in bytes
          example: 125000
        is_large_export:
          type: boolean
          description: True if export exceeds large threshold (>1000 records or >1MB)
          example: false

    # Enumerations mirrored from internal/domain/enums.go. Each list must match
    # its domain type exactly: enums_contract_test.go fails when they diverge.
    ResearchStatus:
      type: string
      description: Confidence level of genealogical data per GPS standards
      enum: [certain, probable, possible, unknown]
      default: unknown
      example: "probable"

    Gender:
      type: string
      enum: [male, female, unknown]

    RelationType:
      type: string
      description: Relationship between a family's partners
      enum: [marriage, partnership, unknown]

    ChildRelationType:
      type: string
      description: Relationship between a child and its family
      enum: [biological, adopted, foster]

    SourceType:
      type: string
      description: Kind of source material
      enum: [book, archive, webpage, census, vital_record, church_record, newspaper, photograph, interview, correspondence, other]

    SourceQuality:
      type: string
      description: Quality of a source per GPS standards
      enum: [original, derivative, authored]

    InformantType:
      type: string
      description: Informant's relation to the event per GPS standards
      enum: [primary, secondary, indeterminate]

    EvidenceType:
      type: string
      description: How the evidence bears on the fact per GPS standards
      enum: [direct, indirect, negative]

    MediaType:
      type: string
      description: Category of media
      enum: [photo, document, audio, video, certificate]

    NameType:
      type: string
      enum: [birth, married, aka, immigrant, religious, professional]

    ConflictStatus:
      type: string
      enum: [open, resolved, accepted]

    ResearchOutcome:
      type: string
      description: Outcome of a research log entry
      enum: [found, not_found, inconclusive]

    FactType:
      type: string
      description: The fact a citation, analysis, conflict or proof summary is about
      enum:
        - person_birth
        - person_death
        - person_name
        - person_gender
        - person_burial
        - person_cremation
        - person_baptism
        - person_christening
        - person_emigration
        - person_immigration
        - person_naturalization
        - person_census
        - person_generic_event
        - person_occupation
        - person_residence
        - person_education
        - person_religion
        - person_title
        - family_marriage
        - family_divorce
        - family_marriage_bann
        - family_marriage_contract
        - family_marriage_license
        - family_marriage_settlement
        - family_annulment
        - family_engagement

    GenDate:
      type: object
      description: Genealogical date with flexible precision
      properties:
        raw:
          type: string
          description: Original date string
          example: "ABT 1850"
        qualifier:
          type: string
          enum: [exact, abt, cal, est, bef, aft, bet, from, int]
          example: "abt"
        calendar:
          type: string
          description: >-
            Calendar system for the date, using the GEDCOM escape token
            (DGREGORIAN, DJULIAN, DHEBREW, or "DFRENCH R"). Absent or DGREGORIAN
            means the Gregorian calendar.
          example: "DJULIAN"
        year:
          type: integer
          example: 1850
        month:
          type: integer
          minimum: 1
          maximum: 13
        day:
          type: integer
          minimum: 1
          maximum: 31
        year2:
          type: integer
          description: End year for ranges
        month2:
          type: integer
        day2:
          type: integer
        interpreted_from:
          type: string
          description: >-
            Original ambiguous phrase for interpreted (INT) dates, preserved for
            research transparency (e.g. "about eighteen fifty")
          example: "about eighteen fifty"

    Person:
      type: object
      required: [id, given_name, surname, version]
      properties:
        id:
          type: string
          format: uuid
        given_name:
          type: string
          maxLength: 100
        surname:
          type: string
          maxLength: 100
        gender:
          $ref: '#/components/schemas/Gender'
        birth_date:
          $ref: '#/components/schemas/GenDate'
        birth_place:
          type: string
        birth_place_latitude:
          type: string
          nullable: true
          description: Latitude in GEDCOM format (e.g., "N42.3601")
        birth_place_longitude:
          type: string
          nullable: true
          description: Longitude in GEDCOM format (e.g., "W71.0589")
        death_date:
          $ref: '#/components/schemas/GenDate'
        death_place:
          type: string
        death_place_latitude:
          type: string
          nullable: true
          description: Latitude in GEDCOM format (e.g., "N42.3601")
        death_place_longitude:
          type: string
          nullable: true
          description: Longitude in GEDCOM format (e.g., "W71.0589")
        notes:
          type: string
        research_status:
          $ref: '#/components/schemas/ResearchStatus'
        brick_wall_note:
          type: string
          nullable: true
        brick_wall_since:
          type: string
          format: date-time
          nullable: true
        brick_wall_resolved_at:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer
          format: int64
          description: Optimistic locking version

    PersonCreate:
      type: object
      required: [given_name]
      properties:
        given_name:
          type: string
          minLength: 1
          maxLength: 100
        surname:
          type: string
          maxLength: 100
        gender:
          $ref: '#/components/schemas/Gender'
        birth_date:
          type: string
          description: GEDCOM-format date string
          example: "1 JAN 1850"
        birth_place:
          type: string
        death_date:
          type: string
          description: GEDCOM-format date string
        death_place:
          type: string
        notes:
          type: string
        research_status:
          $ref: '#/components/schemas/ResearchStatus'

    PersonUpdate:
      type: object
      required: [version]
      properties:
        given_name:
          type: string
          minLength: 1
          maxLength: 100
        surname:
          type: string
          minLength: 1
          maxLength: 100
        gender:
          $ref: '#/components/schemas/Gender'
        birth_date:
          type: string
        birth_place:
          type: string
        death_date:
          type: string
        death_place:
          type: string
        notes:
          type: string
        research_status:
          $ref: '#/components/schemas/ResearchStatus'
        version:
          type: integer
          format: int64
          description: Current version for optimistic locking

    PersonDetail:
      allOf:
        - $ref: '#/components/schemas/Person'
        - type: object
          properties:
            names:
              type: array
              description: All name variants for the person (birth, married, aliases, etc.)
              items:
                $ref: '#/components/schemas/PersonName'
            families_as_partner:
              type: array
              items:
                $ref: '#/components/schemas/FamilySummary'
            family_as_child:
              $ref: '#/components/schemas/FamilySummary'
            external_ids:
              type: array
              description: >-
                GEDCOM 7.0 external identifiers (EXID) with resolved display label and link.
                Read-only: populated from GEDCOM import; there is no direct-write endpoint.
              items:
                $ref: '#/components/schemas/ExternalLink'

    ExternalLink:
      type: object
      required: [value, type, label]
      description: >-
        A GEDCOM 7.0 external identifier (EXID) with a resolved display label and,
        for recognized systems, a browsable URL.
      properties:
        value:
          type: string
          description: The external identifier value (the EXID payload).
          example: KWCJ-QN7
        type:
          type: string
          description: The type URI identifying the external system.
          example: http://www.familysearch.org/ark
        label:
          type: string
          description: >-
            Human-readable system name, the raw type URI when unrecognized, or a
            generic "External ID" when the source record omitted the type. Never empty.
          example: FamilySearch
        url:
          type: string
          description: >-
            Browsable URL for the identifier; omitted when the system is unrecognized.
            The identifier value is URL-escaped for its position in the template.
          example: https://www.familysearch.org/tree/person/details/KWCJ-QN7

    PersonSummary:
      type: object
      required: [id, given_name, surname]
      properties:
        id:
          type: string
          format: uuid
        given_name:
          type: string
        surname:
          type: string
        gender:
          # Set on search results; absent on a family's partner and child summaries.
          $ref: '#/components/schemas/Gender'
        birth_date:
          $ref: '#/components/schemas/GenDate'
        death_date:
          $ref: '#/components/schemas/GenDate'

    PersonList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Person'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    Family:
      type: object
      required: [id, version]
      properties:
        id:
          type: string
          format: uuid
        partner1_id:
          type: string
          format: uuid
        partner2_id:
          type: string
          format: uuid
        relationship_type:
          $ref: '#/components/schemas/RelationType'
        marriage_date:
          $ref: '#/components/schemas/GenDate'
        marriage_place:
          type: string
        marriage_place_latitude:
          type: string
          nullable: true
          description: Latitude in GEDCOM format (e.g., "N39.7817")
        marriage_place_longitude:
          type: string
          nullable: true
          description: Longitude in GEDCOM format (e.g., "W89.6501")
        version:
          type: integer
          format: int64

    FamilyCreate:
      type: object
      properties:
        partner1_id:
          type: string
          format: uuid
        partner2_id:
          type: string
          format: uuid
        relationship_type:
          $ref: '#/components/schemas/RelationType'
        marriage_date:
          type: string
        marriage_place:
          type: string

    FamilyUpdate:
      type: object
      required: [version]
      properties:
        partner1_id:
          type: string
          format: uuid
          description: Set partner 1 to this person. Omit to leave partner 1 unchanged.
        partner2_id:
          type: string
          format: uuid
          description: Set partner 2 to this person. Omit to leave partner 2 unchanged.
        clear_partner1:
          type: boolean
          default: false
          description: >-
            Remove partner 1 from the family. Cannot be combined with partner1_id.
        clear_partner2:
          type: boolean
          default: false
          description: >-
            Remove partner 2 from the family. Cannot be combined with partner2_id.
        relationship_type:
          $ref: '#/components/schemas/RelationType'
        marriage_date:
          type: string
        marriage_place:
          type: string
        version:
          type: integer
          format: int64

    FamilyDetail:
      allOf:
        - $ref: '#/components/schemas/Family'
        - type: object
          properties:
            partner1:
              allOf:
                - $ref: '#/components/schemas/PersonSummary'
              description: Partner 1 summary. Present whenever partner1_id is set; given_name and surname may be empty strings if the partner has no recorded name.
            partner2:
              allOf:
                - $ref: '#/components/schemas/PersonSummary'
              description: Partner 2 summary. Present whenever partner2_id is set; given_name and surname may be empty strings if the partner has no recorded name.
            children:
              type: array
              items:
                $ref: '#/components/schemas/FamilyChild'
            external_ids:
              type: array
              description: >-
                GEDCOM 7.0 external identifiers (EXID) with resolved display label and link.
                Read-only: populated from GEDCOM import; there is no direct-write endpoint.
              items:
                $ref: '#/components/schemas/ExternalLink'

    FamilySummary:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        partner1_name:
          type: string
        partner2_name:
          type: string
        relationship_type:
          $ref: '#/components/schemas/RelationType'

    FamilyChild:
      type: object
      required: [person_id, relationship_type]
      properties:
        person_id:
          type: string
          format: uuid
        person:
          $ref: '#/components/schemas/PersonSummary'
        relationship_type:
          $ref: '#/components/schemas/ChildRelationType'
        sequence:
          type: integer

    AddChild:
      type: object
      required: [person_id]
      properties:
        person_id:
          type: string
          format: uuid
        relationship_type:
          allOf:
            - $ref: '#/components/schemas/ChildRelationType'
          default: biological
          description: Relationship between the child and the family; biological when omitted.
        sequence:
          type: integer

    FamilyList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FamilyDetail'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    FamilyGroupSheet:
      type: object
      description: Traditional family group sheet showing parents, children, and key events
      required: [id]
      properties:
        id:
          type: string
          format: uuid
          description: Family ID
        husband:
          $ref: '#/components/schemas/GroupSheetPerson'
        wife:
          $ref: '#/components/schemas/GroupSheetPerson'
        marriage:
          $ref: '#/components/schemas/GroupSheetEvent'
        children:
          type: array
          items:
            $ref: '#/components/schemas/GroupSheetChild'

    GroupSheetPerson:
      type: object
      description: Person details for group sheet display
      required: [id, given_name, surname]
      properties:
        id:
          type: string
          format: uuid
        given_name:
          type: string
        surname:
          type: string
        gender:
          $ref: '#/components/schemas/Gender'
        birth:
          $ref: '#/components/schemas/GroupSheetEvent'
        death:
          $ref: '#/components/schemas/GroupSheetEvent'
        father_name:
          type: string
          description: Name of father (if known)
        father_id:
          type: string
          format: uuid
        mother_name:
          type: string
          description: Name of mother (if known)
        mother_id:
          type: string
          format: uuid

    GroupSheetEvent:
      type: object
      description: Event details for group sheet display
      properties:
        date:
          type: string
          description: Formatted date string
        place:
          type: string
        is_negated:
          type: boolean
          description: Whether this is a negative assertion (event did NOT occur)
          default: false
        citations:
          type: array
          items:
            $ref: '#/components/schemas/GroupSheetCitation'

    GroupSheetChild:
      type: object
      description: Child entry in family group sheet
      required: [id, given_name, surname]
      properties:
        id:
          type: string
          format: uuid
        given_name:
          type: string
        surname:
          type: string
        gender:
          $ref: '#/components/schemas/Gender'
        relationship_type:
          $ref: '#/components/schemas/ChildRelationType'
        sequence:
          type: integer
          description: Birth order
        birth:
          $ref: '#/components/schemas/GroupSheetEvent'
        death:
          $ref: '#/components/schemas/GroupSheetEvent'
        spouse_name:
          type: string
          description: Name of spouse (if married)
        spouse_id:
          type: string
          format: uuid

    GroupSheetCitation:
      type: object
      description: Citation reference for group sheet
      required: [id, source_title]
      properties:
        id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
        source_title:
          type: string
        page:
          type: string
        detail:
          type: string
          description: Combined citation detail (page, volume, etc.)

    Pedigree:
      type: object
      required: [root]
      properties:
        root:
          $ref: '#/components/schemas/PedigreeNode'
        generations:
          type: integer
          description: Number of generations included
        total_ancestors:
          type: integer
          description: Total number of known ancestors
        max_generation:
          type: integer
          description: Maximum generation depth reached

    PedigreeNode:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        given_name:
          type: string
        surname:
          type: string
        birth_date:
          $ref: '#/components/schemas/GenDate'
        death_date:
          $ref: '#/components/schemas/GenDate'
        gender:
          $ref: '#/components/schemas/Gender'
        generation:
          type: integer
          description: Generation level (0 = subject, 1 = parents, 2 = grandparents, etc.)
        father:
          $ref: '#/components/schemas/PedigreeNode'
        mother:
          $ref: '#/components/schemas/PedigreeNode'

    Descendancy:
      type: object
      description: Descendancy tree showing descendants of a person
      required: [root]
      properties:
        root:
          $ref: '#/components/schemas/DescendancyNode'
        generations:
          type: integer
          description: Number of generations included
        total_descendants:
          type: integer
          description: Total number of descendants
        max_generation:
          type: integer
          description: Maximum generation depth reached

    DescendancyNode:
      type: object
      description: A person node in the descendancy tree
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        given_name:
          type: string
        surname:
          type: string
        birth_date:
          $ref: '#/components/schemas/GenDate'
        death_date:
          $ref: '#/components/schemas/GenDate'
        gender:
          $ref: '#/components/schemas/Gender'
        generation:
          type: integer
          description: Generation level (0 = root, 1 = children, 2 = grandchildren, etc.)
        spouses:
          type: array
          items:
            $ref: '#/components/schemas/SpouseInfo'
        children:
          type: array
          items:
            $ref: '#/components/schemas/DescendancyNode'

    SpouseInfo:
      type: object
      description: Spouse information in the descendancy tree
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        marriage_date:
          $ref: '#/components/schemas/GenDate'

    AhnentafelResponse:
      type: object
      description: |
        Ahnentafel (ancestor table) report using standard genealogical numbering.
        This schema is shared between backend and frontend - changes require updates to both.
      required: [subject, entries, generations, total_count, known_count]
      properties:
        subject:
          $ref: '#/components/schemas/AhnentafelSubject'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AhnentafelEntry'
          description: List of ancestors in Ahnentafel number order
        generations:
          type: integer
          description: Number of generations included in the report
          example: 4
        total_count:
          type: integer
          description: Total number of entries (2^(generations+1) - 1)
          example: 31
        known_count:
          type: integer
          description: Number of entries with known ancestors
          example: 15

    AhnentafelSubject:
      type: object
      description: The subject (root person) of the Ahnentafel report
      required: [id, given_name, surname]
      properties:
        id:
          type: string
          format: uuid
        given_name:
          type: string
        surname:
          type: string

    AhnentafelEntry:
      type: object
      description: A single entry in the Ahnentafel report
      required: [number, generation, relationship]
      properties:
        number:
          type: integer
          description: Ahnentafel number (1=subject, 2=father, 3=mother, etc.)
          minimum: 1
          example: 4
        generation:
          type: integer
          description: Generation number (0=subject, 1=parents, 2=grandparents, etc.)
          minimum: 0
          example: 2
        id:
          type: string
          format: uuid
          description: Person ID (omitted if ancestor is unknown)
        given_name:
          type: string
          description: Given name (omitted if ancestor is unknown)
        surname:
          type: string
          description: Surname (omitted if ancestor is unknown)
        gender:
          # Gender (omitted if ancestor is unknown)
          $ref: '#/components/schemas/Gender'
        birth_date:
          $ref: '#/components/schemas/GenDate'
        birth_place:
          type: string
        death_date:
          $ref: '#/components/schemas/GenDate'
        death_place:
          type: string
        relationship:
          type: string
          description: Human-readable relationship to subject
          example: "Father's Father"

    SearchResults:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
        total:
          type: integer
        query:
          type: string

    SearchResult:
      allOf:
        - $ref: '#/components/schemas/PersonSummary'
        - type: object
          properties:
            score:
              type: number
              format: float
              description: Relevance score (0-1)

    ImportResult:
      type: object
      required: [success, persons_imported, families_imported]
      properties:
        success:
          type: boolean
        persons_imported:
          type: integer
        families_imported:
          type: integer
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ImportWarning'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ImportError'

    ImportWarning:
      type: object
      required: [line, message]
      properties:
        line:
          type: integer
        record:
          type: string
          description: GEDCOM @XREF@ if available
        message:
          type: string

    ImportError:
      type: object
      required: [line, message]
      properties:
        line:
          type: integer
        record:
          type: string
        message:
          type: string

    ChangeEntry:
      type: object
      required: [id, timestamp, entity_type, entity_id, action]
      properties:
        id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
          description: |
            When the change reached this line of research. For a change a
            merge replayed onto the mainline that is the merge; when it was
            made on the branch is `merged_from.original_timestamp`.
        entity_type:
          type: string
          enum: [person, family, source, citation, media, note, submitter, repository, association, life_event, attribute, lds_ordinance, evidence_analysis, evidence_conflict, research_log, proof_summary, branch]
          description: |
            The kind of entity the change is about. A person's name variants
            live on the person, so a name change is a `person` entry whose
            `changes` carry the `name`. `branch` is a research branch's
            lifecycle, in the global history only: `created`, `merged` (its
            `changes.merge_note` carries the note) and `deleted` (archived).
        entity_id:
          type: string
          format: uuid
          description: |
            The changed entity's id (its event stream). Merge exclusions and
            conflicts are keyed by this id.
        entity_name:
          type: string
          description: |
            Human-readable name of the entity: a person's or family's names, a
            source title, a life event's or attribute's fact type and date, a
            note excerpt, a media title, a research log's search, an evidence
            analysis's or proof summary's fact type and conclusion, an
            association's role and people.
        action:
          type: string
          enum: [created, updated, deleted, merged]
          description: |
            `merged` is a person merge, reported on the surviving person, or a
            research branch merged into the mainline.
        changes:
          type: object
          description: |
            Field-level changes for updates and merges. `old_value` is the value
            the change replaced, derived from the entity's earlier events.
          additionalProperties:
            $ref: '#/components/schemas/FieldChange'
        parent_entity_type:
          type: string
          enum: [person, family, source]
          description: |
            For a record without a page of its own, the kind of entity whose
            page presents it: a life event's or LDS ordinance's person or
            family, an attribute's or association's person, a citation's
            source, a media item's owner. Absent otherwise.
        parent_entity_id:
          type: string
          format: uuid
          description: The id of the entity `parent_entity_type` names.
        user_id:
          type: string
          description: ID of user who made the change (null if single-user)
        origin:
          type: string
          enum: [main, branch]
          description: |
            Set only on branch-scoped entity history and branch-scoped snapshot
            comparisons (`?branch=`): `branch` for the branch's own events,
            `main` for the mainline events its view inherits (ADR-005). Absent
            everywhere else.
        merged_from:
          $ref: '#/components/schemas/MergeOrigin'

    MergeOrigin:
      type: object
      description: |
        The merge that brought a mainline change over from a research branch.
        Present only on changes a merge replayed; changes replayed by a merge
        recorded before this was tracked carry none.
      required: [branch_id, branch_name, merged_at, original_timestamp]
      properties:
        branch_id:
          type: string
          format: uuid
        branch_name:
          type: string
          description: The branch's name when it was merged
        note:
          type: string
          description: The merge note - why the research was promoted
        merged_at:
          type: string
          format: date-time
        original_timestamp:
          type: string
          format: date-time
          description: When the change was made on the branch

    FieldChange:
      type: object
      properties:
        old_value:
          description: Previous value (null for new fields)
        new_value:
          description: New value (null for removed fields)

    ChangeHistoryResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChangeEntry'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        has_more:
          type: boolean

    RestorePoint:
      type: object
      required: [version, timestamp, action, summary]
      properties:
        version:
          type: integer
          format: int64
          description: The version number of this restore point
          example: 2
        timestamp:
          type: string
          format: date-time
          description: When this version was created
          example: "2024-01-15T10:30:00Z"
        action:
          type: string
          enum: [created, updated, deleted, linked, unlinked]
          description: The action that created this version
          example: "updated"
        summary:
          type: string
          description: Human-readable summary of the changes
          example: "updated given_name, birth_date"

    RestorePointsResponse:
      type: object
      required: [items, total, has_more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RestorePoint'
        total:
          type: integer
          description: Total number of restore points available
        has_more:
          type: boolean
          description: Whether there are more restore points beyond the current page

    RollbackRequest:
      type: object
      required: [target_version]
      properties:
        target_version:
          type: integer
          format: int64
          minimum: 1
          description: The version number to rollback to
          example: 2

    RollbackResponse:
      type: object
      required: [entity_id, entity_type, new_version, changes, message]
      properties:
        entity_id:
          type: string
          format: uuid
          description: ID of the entity that was rolled back
        entity_type:
          type: string
          enum: [Person, Family, Source, Citation]
          description: Type of entity that was rolled back
        new_version:
          type: integer
          format: int64
          description: The new version number after the rollback
        changes:
          type: object
          additionalProperties: true
          description: Map of field names to their restored values
        message:
          type: string
          description: Success message
          example: "Person rolled back successfully"

    # Media schemas
    Media:
      type: object
      required: [id, entity_type, entity_id, title, mime_type, filename, file_size, version]
      properties:
        id:
          type: string
          format: uuid
        entity_type:
          type: string
          enum: [person, family, source]
        entity_id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 500
        description:
          type: string
        mime_type:
          type: string
          example: "image/jpeg"
        media_type:
          $ref: '#/components/schemas/MediaType'
        filename:
          type: string
        file_size:
          type: integer
          format: int64
          description: File size in bytes
        has_thumbnail:
          type: boolean
          description: Whether a thumbnail is available
        crop_left:
          type: integer
        crop_top:
          type: integer
        crop_width:
          type: integer
        crop_height:
          type: integer
        version:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        # GEDCOM 7.0 enhanced fields
        files:
          type: array
          description: Multiple file references (GEDCOM 7.0 support)
          items:
            $ref: '#/components/schemas/MediaFile'
        format:
          type: string
          description: Primary format/MIME type (FORM tag)
          example: "image/jpeg"
        translations:
          type: array
          description: Translated titles (GEDCOM 7.0 support)
          items:
            type: string

    MediaFile:
      type: object
      description: A single file reference within a media object (GEDCOM 7.0 FILE structure)
      properties:
        path:
          type: string
          description: File path or URL
        format:
          type: string
          description: MIME type (FORM tag)
          example: "image/jpeg"
        media_type:
          type: string
          description: Media type categorization (MEDI tag)
          example: "PHOTO"
        title:
          type: string
          description: Title for this specific file
        translations:
          type: array
          description: Alternate versions (transcripts, thumbnails, different formats)
          items:
            $ref: '#/components/schemas/MediaTranslation'

    MediaTranslation:
      type: object
      description: Alternate version of a file (GEDCOM 7.0 FILE-TRAN structure)
      properties:
        path:
          type: string
          description: File path or URL of the translation
        format:
          type: string
          description: MIME type of the translation file

    MediaList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Media'
        total:
          type: integer
          description: Total number of media items

    MediaUpdate:
      type: object
      required: [version]
      properties:
        title:
          type: string
          maxLength: 500
        description:
          type: string
        media_type:
          $ref: '#/components/schemas/MediaType'
        crop_left:
          type: integer
        crop_top:
          type: integer
        crop_width:
          type: integer
        crop_height:
          type: integer
        version:
          type: integer
          format: int64
          description: Current version for optimistic locking

    # Browse schemas
    SurnameIndexResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SurnameEntry'
        total:
          type: integer
          description: Total number of unique surnames
        letter_counts:
          type: array
          items:
            $ref: '#/components/schemas/LetterCount'
          description: Count of surnames by starting letter

    SurnameEntry:
      type: object
      required: [surname, count]
      properties:
        surname:
          type: string
        count:
          type: integer
          description: Number of persons with this surname

    LetterCount:
      type: object
      required: [letter, count]
      properties:
        letter:
          type: string
          description: A-Z letter
        count:
          type: integer
          description: Number of surnames starting with this letter

    PlaceIndexResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlaceEntry'
        total:
          type: integer
          description: Total number of unique places at this level
        breadcrumb:
          type: array
          items:
            type: string
          description: Path from root to current level

    PlaceEntry:
      type: object
      required: [name, count]
      properties:
        name:
          type: string
          description: Place name at this level
        full_name:
          type: string
          description: Full place path
        count:
          type: integer
          description: Number of persons associated with this place
        has_children:
          type: boolean
          description: Whether this place has sub-locations

    CemeteryIndexResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CemeteryEntry'
        total:
          type: integer
          description: Total number of unique burial/cremation places

    CemeteryEntry:
      type: object
      required: [place, count]
      properties:
        place:
          type: string
          description: Cemetery or burial place name
        count:
          type: integer
          description: Number of persons buried/cremated here

    MapLocationsResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MapLocation'
        total:
          type: integer
          description: Total number of locations with coordinates

    MapLocation:
      type: object
      required: [place, latitude, longitude, event_type, count, person_ids]
      properties:
        place:
          type: string
          description: Place name
        latitude:
          type: number
          format: double
          description: Latitude in decimal degrees
        longitude:
          type: number
          format: double
          description: Longitude in decimal degrees
        event_type:
          type: string
          enum: [birth, death]
          description: Type of life event at this location
        count:
          type: integer
          description: Number of persons at this location
        person_ids:
          type: array
          items:
            type: string
            format: uuid
          description: IDs of persons at this location

    BrickWallsResponse:
      type: object
      required: [items, active_count, resolved_count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BrickWallEntry'
        active_count:
          type: integer
        resolved_count:
          type: integer

    BrickWallEntry:
      type: object
      required: [person_id, person_name, note, since]
      properties:
        person_id:
          type: string
          format: uuid
        person_name:
          type: string
        note:
          type: string
        since:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time

    # Source schemas
    Source:
      type: object
      required: [id, source_type, title, version]
      properties:
        id:
          type: string
          format: uuid
        source_type:
          $ref: '#/components/schemas/SourceType'
        title:
          type: string
        author:
          type: string
        publisher:
          type: string
        publish_date:
          type: string
        url:
          type: string
          format: uri
        repository_name:
          type: string
        collection_name:
          type: string
        call_number:
          type: string
        notes:
          type: string
        citation_count:
          type: integer
          description: Number of citations referencing this source
        version:
          type: integer
          format: int64
          description: Optimistic locking version

    SourceCreate:
      type: object
      required: [source_type, title]
      properties:
        source_type:
          $ref: '#/components/schemas/SourceType'
        title:
          type: string
        author:
          type: string
        publisher:
          type: string
        publish_date:
          type: string
        url:
          type: string
          format: uri
        repository_name:
          type: string
        collection_name:
          type: string
        call_number:
          type: string
        notes:
          type: string

    SourceUpdate:
      type: object
      required: [version]
      properties:
        source_type:
          $ref: '#/components/schemas/SourceType'
        title:
          type: string
        author:
          type: string
        publisher:
          type: string
        publish_date:
          type: string
        url:
          type: string
          format: uri
        repository_name:
          type: string
        collection_name:
          type: string
        call_number:
          type: string
        notes:
          type: string
        version:
          type: integer
          format: int64
          description: Current version for optimistic locking

    SourceDetail:
      allOf:
        - $ref: '#/components/schemas/Source'
        - type: object
          properties:
            citations:
              type: array
              items:
                $ref: '#/components/schemas/Citation'
            external_ids:
              type: array
              description: >-
                GEDCOM 7.0 external identifiers (EXID) with resolved display label and link.
                Read-only: populated from GEDCOM import; there is no direct-write endpoint.
              items:
                $ref: '#/components/schemas/ExternalLink'

    SourceList:
      type: object
      required: [sources, total]
      properties:
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    SourceSearchResults:
      type: object
      required: [sources, total, query]
      properties:
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        total:
          type: integer
        query:
          type: string

    # PersonName schemas
    PersonName:
      type: object
      required: [id, person_id, given_name, surname, name_type, is_primary]
      properties:
        id:
          type: string
          format: uuid
        person_id:
          type: string
          format: uuid
        given_name:
          type: string
          maxLength: 100
        surname:
          type: string
          maxLength: 100
        full_name:
          type: string
          readOnly: true
        name_prefix:
          type: string
        name_suffix:
          type: string
        surname_prefix:
          type: string
        nickname:
          type: string
        name_type:
          $ref: '#/components/schemas/NameType'
        is_primary:
          type: boolean

    PersonNameCreate:
      type: object
      required: [given_name, surname, name_type]
      properties:
        given_name:
          type: string
          minLength: 1
          maxLength: 100
        surname:
          type: string
          maxLength: 100
        name_prefix:
          type: string
        name_suffix:
          type: string
        surname_prefix:
          type: string
        nickname:
          type: string
        name_type:
          $ref: '#/components/schemas/NameType'
        is_primary:
          type: boolean
          default: false

    PersonNameUpdate:
      type: object
      properties:
        given_name:
          type: string
          minLength: 1
          maxLength: 100
        surname:
          type: string
          maxLength: 100
        name_prefix:
          type: string
        name_suffix:
          type: string
        surname_prefix:
          type: string
        nickname:
          type: string
        name_type:
          $ref: '#/components/schemas/NameType'
        is_primary:
          type: boolean

    PersonNameList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PersonName'
        total:
          type: integer

    # Citation schemas
    Citation:
      type: object
      required: [id, source_id, source_title, fact_type, fact_owner_id, version]
      properties:
        id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
        source_title:
          type: string
          description: Title of the referenced source
        fact_type:
          $ref: '#/components/schemas/FactType'
        fact_owner_id:
          type: string
          format: uuid
          description: ID of the person or family this citation applies to
        page:
          type: string
        volume:
          type: string
        source_quality:
          $ref: '#/components/schemas/SourceQuality'
        informant_type:
          $ref: '#/components/schemas/InformantType'
        evidence_type:
          $ref: '#/components/schemas/EvidenceType'
        quoted_text:
          type: string
          description: Exact text quoted from the source
        analysis:
          type: string
          description: Researcher's analysis of the citation
        template_id:
          type: string
          description: Evidence Explained citation template ID
        fields:
          type: object
          additionalProperties:
            type: string
          description: Template-specific field values
        gedcom_xref:
          type: string
          description: GEDCOM cross-reference ID (e.g., "@C1@") for round-trip support
        version:
          type: integer
          format: int64
          description: Optimistic locking version

    CitationCreate:
      type: object
      required: [source_id, fact_type, fact_owner_id]
      properties:
        source_id:
          type: string
          format: uuid
        fact_type:
          $ref: '#/components/schemas/FactType'
        fact_owner_id:
          type: string
          format: uuid
          description: ID of the person or family this citation applies to
        page:
          type: string
        volume:
          type: string
        source_quality:
          $ref: '#/components/schemas/SourceQuality'
        informant_type:
          $ref: '#/components/schemas/InformantType'
        evidence_type:
          $ref: '#/components/schemas/EvidenceType'
        quoted_text:
          type: string
        analysis:
          type: string
        template_id:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
          description: Template-specific field values
        gedcom_xref:
          type: string
          description: Optional GEDCOM cross-reference ID for import

    CitationUpdate:
      type: object
      required: [version]
      properties:
        page:
          type: string
        volume:
          type: string
        source_quality:
          $ref: '#/components/schemas/SourceQuality'
        informant_type:
          $ref: '#/components/schemas/InformantType'
        evidence_type:
          $ref: '#/components/schemas/EvidenceType'
        quoted_text:
          type: string
        analysis:
          type: string
        template_id:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
          description: Template-specific field values
        version:
          type: integer
          format: int64
          description: Current version for optimistic locking

    CitationList:
      type: object
      required: [citations, total]
      properties:
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
        total:
          type: integer

    CitationTemplate:
      type: object
      required: [id, name, category, source_types, fields]
      properties:
        id:
          type: string
          description: Stable template identifier (e.g., census.us.federal)
        name:
          type: string
          description: Human-readable template name
        category:
          type: string
          description: Template category (e.g., Census Records)
        description:
          type: string
          description: Brief help text
        source_types:
          type: array
          items:
            $ref: '#/components/schemas/SourceType'
          description: Applicable source types
        fields:
          type: array
          items:
            $ref: '#/components/schemas/CitationTemplateField'
          description: Ordered list of field definitions

    CitationTemplateField:
      type: object
      required: [key, label, required]
      properties:
        key:
          type: string
          description: Machine key for the field
        label:
          type: string
          description: Human-readable label
        help_text:
          type: string
          description: Guidance for the user
        required:
          type: boolean
          description: Whether the field is required

    CitationTemplateList:
      type: object
      required: [templates]
      properties:
        templates:
          type: array
          items:
            $ref: '#/components/schemas/CitationTemplate'

    FormattedCitation:
      type: object
      required: [full, short]
      properties:
        full:
          type: string
          description: Full formatted citation text
        short:
          type: string
          description: Short formatted citation text
        validation_issues:
          type: array
          items:
            $ref: '#/components/schemas/CitationValidationIssue'
          description: Any field validation warnings or errors

    CitationValidationIssue:
      type: object
      required: [field, message, level]
      properties:
        field:
          type: string
        message:
          type: string
        level:
          type: string
          enum: [error, warning]

    # Quality and Statistics schemas
    QualityOverview:
      type: object
      required: [total_persons, average_completeness, records_with_issues, top_issues, research_status_counts, lowest_scoring]
      properties:
        total_persons:
          type: integer
          description: Total number of persons in the tree
        average_completeness:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Average completeness score across all persons (0-100)
        records_with_issues:
          type: integer
          description: Number of persons with at least one data quality issue
        top_issues:
          type: array
          items:
            $ref: '#/components/schemas/QualityIssue'
          description: Most common data quality issues
        research_status_counts:
          $ref: '#/components/schemas/ResearchStatusCounts'
        lowest_scoring:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/PersonScore'
          description: Up to 20 persons with at least one issue, lowest completeness first

    ResearchStatusCounts:
      type: object
      description: Persons counted by research status
      required: [certain, probable, possible, unknown, unset]
      properties:
        certain:
          type: integer
        probable:
          type: integer
        possible:
          type: integer
        unknown:
          type: integer
        unset:
          type: integer
          description: Persons with no research status recorded

    PersonScore:
      type: object
      description: One person's completeness score and the issues behind it
      required: [person_id, given_name, surname, completeness_score, issues]
      properties:
        person_id:
          type: string
          format: uuid
        given_name:
          type: string
        surname:
          type: string
        completeness_score:
          type: number
          format: float
          minimum: 0
          maximum: 100
        issues:
          type: array
          items:
            type: string

    QualityIssue:
      type: object
      required: [issue, count]
      properties:
        issue:
          type: string
          description: Description of the issue
        count:
          type: integer
          description: Number of records with this issue

    PersonQuality:
      type: object
      required: [person_id, completeness_score, issues, suggestions]
      properties:
        person_id:
          type: string
          format: uuid
        completeness_score:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Data completeness score (0-100)
        issues:
          type: array
          items:
            type: string
          description: List of data quality issues
        suggestions:
          type: array
          items:
            type: string
          description: Suggested improvements

    DiscoveryFeedResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DiscoverySuggestion'
        total:
          type: integer

    DiscoverySuggestion:
      type: object
      required: [type, title, description, action_url, priority]
      properties:
        type:
          type: string
          enum: [missing_data, orphan, unassessed, quality_gap, brick_wall_resolved]
        title:
          type: string
        description:
          type: string
        person_id:
          type: string
          format: uuid
        person_name:
          type: string
        action_url:
          type: string
        priority:
          type: integer
          minimum: 1
          description: Priority score (1=high, 2=medium, 3=low)

    QualityReport:
      type: object
      description: Comprehensive data quality report with coverage metrics and issue aggregation
      required: [total_individuals, total_families, total_sources, birth_date_coverage, death_date_coverage, source_coverage, error_count, warning_count, info_count, top_issues]
      properties:
        total_individuals:
          type: integer
          description: Total number of individuals in the tree
        total_families:
          type: integer
          description: Total number of family units
        total_sources:
          type: integer
          description: Total number of source records
        birth_date_coverage:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Fraction of individuals with birth dates (0.0-1.0)
        death_date_coverage:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Fraction of individuals with death dates (0.0-1.0)
        source_coverage:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Fraction of individuals with at least one source citation (0.0-1.0)
        error_count:
          type: integer
          description: Total number of error-level issues
        warning_count:
          type: integer
          description: Total number of warning-level issues
        info_count:
          type: integer
          description: Total number of info-level issues
        top_issues:
          type: array
          items:
            $ref: '#/components/schemas/QualityReportIssue'
          description: Most common issues by count

    QualityReportIssue:
      type: object
      description: Aggregated issue count for quality reports
      required: [code, count]
      properties:
        code:
          type: string
          description: Issue code identifier
        count:
          type: integer
          description: Number of occurrences of this issue

    DuplicatePair:
      type: object
      description: A pair of potentially duplicate persons
      required: [person1_id, person1_name, person2_id, person2_name, confidence, match_reasons]
      properties:
        person1_id:
          type: string
          format: uuid
          description: ID of the first person
        person1_name:
          type: string
          description: Display name of the first person
        person2_id:
          type: string
          format: uuid
          description: ID of the second person
        person2_name:
          type: string
          description: Display name of the second person
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Confidence score that these are duplicates (0.0-1.0)
        match_reasons:
          type: array
          items:
            type: string
          description: Reasons why these persons are considered potential duplicates

    DuplicatesResponse:
      type: object
      description: Response containing potential duplicate pairs
      required: [duplicates, total]
      properties:
        duplicates:
          type: array
          items:
            $ref: '#/components/schemas/DuplicatePair'
          description: List of potential duplicate pairs
        total:
          type: integer
          description: Total number of potential duplicate pairs found

    MergePersonsRequest:
      type: object
      description: Request to merge two person records
      required: [survivor_id, merged_id, survivor_version, merged_version]
      properties:
        survivor_id:
          type: string
          format: uuid
          description: ID of the person that will remain after merge
        merged_id:
          type: string
          format: uuid
          description: ID of the person to be merged into survivor
        survivor_version:
          type: integer
          format: int64
          description: Expected version of survivor for optimistic locking
        merged_version:
          type: integer
          format: int64
          description: Expected version of merged person for optimistic locking
        field_resolution:
          type: object
          additionalProperties:
            type: string
            enum: [survivor, merged]
          description: |
            Optional per-field source selection. Keys are field names
            (given_name, surname, gender, birth_date, birth_place,
            death_date, death_place, notes, research_status).
            Default is "survivor" for all fields unless survivor's value is empty.
          example:
            birth_date: merged
            death_date: survivor

    MergePersonsResponse:
      type: object
      description: Result of merging two persons
      required: [person, merge_summary]
      properties:
        person:
          $ref: '#/components/schemas/Person'
        merge_summary:
          $ref: '#/components/schemas/MergeSummary'

    MergeSummary:
      type: object
      description: Summary of what was merged
      required: [merged_person_name, fields_updated, families_updated, citations_transferred, names_transferred, events_transferred, media_transferred]
      properties:
        merged_person_name:
          type: string
          description: Full name of the person that was merged
        fields_updated:
          type: array
          items:
            type: string
          description: List of fields that were updated from merged person
        families_updated:
          type: integer
          description: Number of families where partner reference was updated
        citations_transferred:
          type: integer
          description: Number of citations transferred to survivor
        names_transferred:
          type: integer
          description: Number of alternate names added to survivor
        events_transferred:
          type: integer
          description: Number of life events transferred
        media_transferred:
          type: integer
          description: Number of media files transferred

    DismissDuplicateRequest:
      type: object
      description: Request to dismiss a duplicate pair as false positive
      properties:
        reason:
          type: string
          description: Optional reason for dismissal

    BatchMergeRequest:
      type: object
      description: Request to merge multiple duplicate pairs
      required: [merges]
      properties:
        merges:
          type: array
          items:
            $ref: '#/components/schemas/MergePersonsRequest'
          description: List of merge operations to perform
          minItems: 1
          maxItems: 100

    BatchMergeResponse:
      type: object
      description: Results of batch merge operation
      required: [total, successful, failed, results]
      properties:
        total:
          type: integer
          description: Total number of merge operations attempted
        successful:
          type: integer
          description: Number of successful merges
        failed:
          type: integer
          description: Number of failed merges
        results:
          type: array
          items:
            $ref: '#/components/schemas/BatchMergeResult'
          description: Individual results for each merge operation

    BatchMergeResult:
      type: object
      description: Result of a single merge operation in batch
      required: [survivor_id, merged_id, success]
      properties:
        survivor_id:
          type: string
          format: uuid
          description: ID of the survivor person
        merged_id:
          type: string
          format: uuid
          description: ID of the merged person
        success:
          type: boolean
          description: Whether the merge succeeded
        error:
          type: string
          description: Error message if merge failed
        merge_summary:
          $ref: '#/components/schemas/MergeSummary'

    BatchDismissRequest:
      type: object
      description: Request to dismiss multiple duplicate pairs
      required: [dismissals]
      properties:
        dismissals:
          type: array
          items:
            $ref: '#/components/schemas/DuplicatePairRef'
          description: List of duplicate pairs to dismiss
          minItems: 1
          maxItems: 100

    DuplicatePairRef:
      type: object
      description: Reference to a duplicate pair
      required: [person1_id, person2_id]
      properties:
        person1_id:
          type: string
          format: uuid
          description: First person ID in the pair
        person2_id:
          type: string
          format: uuid
          description: Second person ID in the pair
        reason:
          type: string
          description: Optional reason for dismissal

    BatchDismissResponse:
      type: object
      description: Results of batch dismiss operation
      required: [total, successful, failed, results]
      properties:
        total:
          type: integer
          description: Total number of dismiss operations attempted
        successful:
          type: integer
          description: Number of successful dismissals
        failed:
          type: integer
          description: Number of failed dismissals
        results:
          type: array
          items:
            $ref: '#/components/schemas/BatchDismissResult'
          description: Individual results for each dismiss operation

    BatchDismissResult:
      type: object
      description: Result of a single dismiss operation in batch
      required: [person1_id, person2_id, success]
      properties:
        person1_id:
          type: string
          format: uuid
          description: First person ID in the pair
        person2_id:
          type: string
          format: uuid
          description: Second person ID in the pair
        success:
          type: boolean
          description: Whether the dismissal succeeded
        error:
          type: string
          description: Error message if dismissal failed

    ValidationIssue:
      type: object
      description: A single validation issue detected in the data
      required: [severity, code, message]
      properties:
        severity:
          type: string
          enum: [error, warning, info]
          description: Severity level of the issue
        code:
          type: string
          description: Issue code identifier
        message:
          type: string
          description: Human-readable description of the issue
        record_id:
          type: string
          format: uuid
          description: ID of the primary record with the issue
        related_record_id:
          type: string
          format: uuid
          description: ID of a related record (if applicable)

    ValidationIssuesResponse:
      type: object
      description: |
        Response containing validation issues categorized by severity.
        Counts always cover the full unfiltered, unpaginated issue set;
        `total` is the count of issues after the severity filter (if any)
        but before pagination, suitable for driving page navigation.
      required: [issues, total, error_count, warning_count, info_count]
      properties:
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
          description: List of validation issues (paginated slice)
        total:
          type: integer
          description: Total number of issues matching the severity filter (pre-pagination)
        error_count:
          type: integer
          description: Total number of error-level issues (unfiltered)
        warning_count:
          type: integer
          description: Total number of warning-level issues (unfiltered)
        info_count:
          type: integer
          description: Total number of info-level issues (unfiltered)

    Statistics:
      type: object
      required: [total_persons, total_families, date_range, top_surnames, gender_distribution]
      properties:
        total_persons:
          type: integer
          description: Total number of persons in the tree
        total_families:
          type: integer
          description: Total number of family units
        date_range:
          $ref: '#/components/schemas/DateRange'
        top_surnames:
          type: array
          items:
            $ref: '#/components/schemas/SurnameCount'
          description: Most common surnames (top 10)
        gender_distribution:
          $ref: '#/components/schemas/GenderDistribution'

    DateRange:
      type: object
      properties:
        earliest_birth:
          type: string
          description: Earliest birth year in the tree
        latest_birth:
          type: string
          description: Latest birth year in the tree

    SurnameCount:
      type: object
      required: [surname, count]
      properties:
        surname:
          type: string
        count:
          type: integer

    GenderDistribution:
      type: object
      required: [male, female, unknown]
      properties:
        male:
          type: integer
        female:
          type: integer
        unknown:
          type: integer

    Snapshot:
      type: object
      required: [id, name, position, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
          description: Name of the research milestone
          example: "Pre-DNA results"
        description:
          type: string
          maxLength: 500
          description: Optional description of the snapshot
          example: "Research state before DNA test results arrived"
        position:
          type: integer
          format: int64
          description: Event store position captured by this snapshot
          example: 42
        branch_id:
          type: string
          format: uuid
          description: |
            The research branch whose view this snapshot marks. Absent for a
            mainline snapshot.
        created_at:
          type: string
          format: date-time
          description: When the snapshot was created

    SnapshotCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Name of the research milestone
        description:
          type: string
          maxLength: 500
          description: Optional description of the snapshot

    SnapshotList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Snapshot'
        total:
          type: integer
          description: Total number of snapshots

    SnapshotComparisonResult:
      type: object
      required: [snapshot1, snapshot2, changes, total_count, has_more, older_first]
      properties:
        snapshot1:
          $ref: '#/components/schemas/Snapshot'
        snapshot2:
          $ref: '#/components/schemas/Snapshot'
        changes:
          type: array
          items:
            $ref: '#/components/schemas/ChangeEntry'
          description: Events that occurred between the two snapshot positions
        total_count:
          type: integer
          description: Number of changes between snapshots
        has_more:
          type: boolean
          description: Whether there are more changes beyond the limit
        older_first:
          type: boolean
          description: True if snapshot1 is the older (lower position) snapshot

    SnapshotCurrentComparisonResult:
      type: object
      required: [snapshot, head_position, to_position, changes, total_count, has_more]
      properties:
        snapshot:
          $ref: '#/components/schemas/Snapshot'
        head_position:
          type: integer
          format: int64
          description: |
            The event log head when the comparison ran — the position a
            snapshot taken now would mark.
        to_position:
          type: integer
          format: int64
          description: |
            The last log position the comparison includes: `head_position`,
            or the requested `until` when that lies before the head.
        changes:
          type: array
          items:
            $ref: '#/components/schemas/ChangeEntry'
          description: Changes recorded after the snapshot, oldest first
        total_count:
          type: integer
          description: Number of changes listed
        has_more:
          type: boolean
          description: Whether there are more changes beyond the limit

    Branch:
      type: object
      required: [id, name, base_position, status, created_at, outcome, subjects, proof_summary_ids]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
          description: Name of the line of research
          example: "Maternal Smith line"
        description:
          type: string
          maxLength: 500
          description: Optional description of what the branch explores
        base_position:
          type: integer
          format: int64
          description: Mainline event store position the branch forked from
          example: 42
        status:
          type: string
          enum: [active, merged, archived]
          description: |
            Lifecycle state. `merged` and `archived` are terminal — a branch in
            either state accepts no further writes. `archived` is the state a
            deleted branch enters; its events are retained but its overlay rows
            are purged.
        created_at:
          type: string
          format: date-time
          description: When the branch was created
        merged_at:
          type: string
          format: date-time
          description: |
            When the branch was merged into the mainline. Absent unless
            `status` is `merged` - it is set only on the `active -> merged`
            transition and never cleared.
        merge_note:
          type: string
          maxLength: 1000
          description: |
            The note recorded with the merge, explaining why the research was
            promoted. Absent unless the branch was merged with a note.
        merge_state:
          type: string
          enum: [complete, incomplete, unknown]
          x-enum-varnames: [MergeStateComplete, MergeStateIncomplete, MergeStateUnknown]
          description: |
            Whether the merge finished (#830). Present on `GET /branches`,
            `GET /branches/{id}` and the comparison's `branch`, and only when
            `status` is `merged`.

            - `complete` - every entity the merge set out to replay is on the
              mainline, or was deliberately left behind, and the mainline's
              data shows it.
            - `incomplete` - the merge answered `500 merge_partially_applied`
              and did not finish: its replay stopped partway, or a replayed
              change reached the mainline's history but not its data.
              `merge_pending` lists what is left;
              `POST /branches/{id}/merge/resume` finishes it.
            - `unknown` - the state could not be read (the branch's recorded
              changes are in a shape a resume refuses too). The branch is
              still listed and readable; `POST /branches/{id}/merge/resume`
              reports what is wrong.

            Computed on every read **without writing anything**, from the same
            read-only checks a resume starts from: which entities already
            reached the mainline's log, which the merge left behind, which
            remain, and which reached the log but whose mainline data is
            behind it (pending as `needs_repair`).
        merge_pending:
          type: array
          items:
            $ref: '#/components/schemas/MergePendingEntity'
          description: |
            Present only when `merge_state` is `incomplete`: the entities a
            resume would still act on (replay, ask about, or repair), in
            replay order.
        closed_at:
          type: string
          format: date-time
          description: |
            When the branch was closed without merging (#836). Absent unless
            `status` is `archived`.
        close_reason:
          type: string
          maxLength: 2000
          description: |
            The reason recorded when the branch was closed. Absent when none was
            given. The outcome it was closed with is `outcome`.
        hypothesis:
          type: string
          maxLength: 2000
          description: |
            The research question the branch explores. Absent when none has
            been recorded.
        subjects:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/BranchSubject'
          description: The persons and families the hypothesis concerns
        outcome:
          $ref: '#/components/schemas/BranchOutcome'
        proof_summary_ids:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
          description: Proof summaries that argue the branch's conclusion
        proof_summaries:
          type: array
          items:
            $ref: '#/components/schemas/BranchProofSummaryRef'
          description: |
            The linked proof summaries, resolved for display. Present on the
            single-branch reads (get, update, compare) and absent on the list;
            a linked summary that no longer exists is left out, while its id
            stays in `proof_summary_ids`.
        drift:
          $ref: '#/components/schemas/BranchDrift'

    BranchDrift:
      type: object
      description: |
        How far the mainline has moved underneath a branch since it forked.
        Present on a `Branch` only when `GET /branches?include_drift=true`
        was asked for it and the branch is active.
      required: [branch_id, base_position, main_change_count, main_change_count_on_branch_entities, has_more]
      properties:
        branch_id:
          type: string
          format: uuid
        base_position:
          type: integer
          format: int64
          description: Mainline event store position the branch forked from
        main_change_count:
          type: integer
          minimum: 0
          description: Mainline changes since the fork, on any entity
        main_change_count_on_branch_entities:
          type: integer
          minimum: 0
          description: |
            The subset of `main_change_count` on entities this branch itself
            changed. These are the mainline changes a compare lists; every
            other mainline change simply shows through the branch.
        has_more:
          type: boolean
          description: A count hit the server's cap and is a lower bound

    BranchOutcome:
      type: string
      enum: [open, proved, disproved, inconclusive, superseded, abandoned]
      default: open
      description: |
        The verdict the research reached. Independent of `status`: status says
        whether the branch still takes writes, outcome says what it concluded.
        `open` means the question is still being worked; `superseded` marks a
        question overtaken by other research; `abandoned` marks research
        stopped without a verdict.

    BranchCloseOutcome:
      type: string
      enum: [disproved, inconclusive, superseded, abandoned]
      description: |
        The outcomes a branch can be closed with (#836). `open` is no verdict,
        and a `proved` branch is merged rather than closed.

    BranchCloseRequest:
      type: object
      required: [outcome]
      properties:
        outcome:
          $ref: '#/components/schemas/BranchCloseOutcome'
        reason:
          type: string
          maxLength: 2000
          description: Why the branch is being closed, in the researcher's words
      example:
        outcome: disproved
        reason: "The 1850 census places Mary in Ohio with a different father."

    BranchResearchArchive:
      type: object
      required: [branch_id, research_logs, evidence_analyses, proof_summaries, deleted_count, truncated]
      description: |
        The GPS artifacts a branch recorded, rebuilt from the branch's own
        events (#836). Each artifact is as the branch left it. Entries are in
        the order the branch first touched them.
      properties:
        branch_id:
          type: string
          format: uuid
        research_logs:
          type: array
          items:
            $ref: '#/components/schemas/ArchivedResearchLog'
        evidence_analyses:
          type: array
          items:
            $ref: '#/components/schemas/ArchivedEvidenceAnalysis'
        proof_summaries:
          type: array
          items:
            $ref: '#/components/schemas/ArchivedProofSummary'
        deleted_count:
          type: integer
          description: GPS artifacts the branch deleted; they are not listed
        truncated:
          type: boolean
          description: |
            The branch has more events than the reconstruction reads, so the
            archive may be incomplete.

    ArchivedResearchLog:
      type: object
      required: [log, created_on_branch]
      properties:
        log:
          $ref: '#/components/schemas/ResearchLog'
        subject_name:
          type: string
          description: |
            Display name of the subject, from the mainline or, for a subject
            that only existed on the branch, as the branch created it.
        created_on_branch:
          type: boolean
          description: |
            The entry was first written on the branch (rather than being a
            mainline entry the branch edited). Only such entries can be
            promoted to the mainline.

    ArchivedEvidenceAnalysis:
      type: object
      required: [analysis, created_on_branch]
      properties:
        analysis:
          $ref: '#/components/schemas/EvidenceAnalysis'
        subject_name:
          type: string
        created_on_branch:
          type: boolean

    ArchivedProofSummary:
      type: object
      required: [summary, created_on_branch]
      properties:
        summary:
          $ref: '#/components/schemas/ProofSummary'
        subject_name:
          type: string
        created_on_branch:
          type: boolean

    PromoteResearchLogsRequest:
      type: object
      properties:
        log_ids:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid
          description: |
            The research logs to promote. Omitted or empty promotes every
            eligible log the branch recorded.

    PromoteResearchLogsResult:
      type: object
      required: [promoted, skipped, truncated]
      properties:
        promoted:
          type: array
          items:
            type: string
            format: uuid
          description: Research logs now on the mainline, under the same ids
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/PromoteSkippedLog'
        truncated:
          type: boolean
          description: The branch's research archive was incomplete (see BranchResearchArchive)

    PromoteSkippedLog:
      type: object
      required: [id, reason]
      properties:
        id:
          type: string
          format: uuid
        reason:
          type: string
          enum: [not_found, not_created_on_branch, already_promoted, subject_not_on_main]
          description: |
            `not_found`: not a research log the branch left.
            `not_created_on_branch`: a mainline entry the branch only edited.
            `already_promoted`: already on the mainline.
            `subject_not_on_main`: its subject does not exist on the mainline,
            so promoting it would leave a dangling reference.

    BranchSubjectType:
      type: string
      enum: [person, family]

    BranchSubjectInput:
      type: object
      required: [type, id]
      properties:
        type:
          $ref: '#/components/schemas/BranchSubjectType'
        id:
          type: string
          format: uuid

    BranchSubject:
      type: object
      required: [type, id]
      properties:
        type:
          $ref: '#/components/schemas/BranchSubjectType'
        id:
          type: string
          format: uuid
        name:
          type: string
          description: |
            Display name, resolved on the single-branch reads. Absent on the
            list, and when the person or family no longer exists.

    BranchProofSummaryRef:
      type: object
      required: [id, fact_type, conclusion]
      properties:
        id:
          type: string
          format: uuid
        fact_type:
          $ref: '#/components/schemas/FactType'
        conclusion:
          type: string

    BranchCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Name of the line of research
        description:
          type: string
          maxLength: 500
          description: Optional description of what the branch explores
        hypothesis:
          type: string
          maxLength: 2000
          description: The research question the branch explores
        subjects:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/BranchSubjectInput'
          description: Persons and families the hypothesis concerns; must exist on the mainline
        outcome:
          $ref: '#/components/schemas/BranchOutcome'
        proof_summary_ids:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
          description: Proof summaries to link; must exist on the mainline

    BranchUpdate:
      type: object
      minProperties: 1
      description: Partial update; see `PATCH /branches/{id}`.
      properties:
        description:
          type: string
          maxLength: 500
        hypothesis:
          type: string
          maxLength: 2000
        subjects:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/BranchSubjectInput'
        outcome:
          $ref: '#/components/schemas/BranchOutcome'
        proof_summary_ids:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid

    BranchList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
        total:
          type: integer
          description: Total number of branches

    BranchComparisonResult:
      type: object
      required:
        - branch
        - base_position
        - branch_changes
        - main_changes
        - branch_change_count
        - main_change_count
        - has_more
        - overlapping_stream_ids
        - conflicts
      properties:
        branch:
          $ref: '#/components/schemas/Branch'
        base_position:
          type: integer
          format: int64
          description: Mainline position the branch forked from - the anchor of this diff
        branch_changes:
          type: array
          items:
            $ref: '#/components/schemas/ChangeEntry'
          description: Changes made on the branch since the fork, oldest first
        main_changes:
          type: array
          items:
            $ref: '#/components/schemas/ChangeEntry'
          description: |
            Changes made on the mainline after the fork point, restricted to the
            entities the branch also touched. Oldest first.
        branch_change_count:
          type: integer
          description: Number of branch-side changes returned
        main_change_count:
          type: integer
          description: Number of main-side changes returned
        has_more:
          type: boolean
          description: True when either side hit the read cap, so this diff is partial
        overlapping_stream_ids:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Entities changed on both the branch and main - a divergence hint for
            human review, not conflict detection.
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/MergeConflict'
          description: |
            The entities whose changes are actually incompatible - a subset of
            `overlapping_stream_ids`. Empty (`[]`, never `null`) when the branch
            merges cleanly. Every entry must be given a resolution in
            `POST /branches/{id}/merge` or the merge is refused.
        replayed_change_count:
          type: integer
          description: |
            For a merged branch: how many of the mainline's events on the
            branch's entities are its merge's replay of the branch's own
            changes. They are left out of `main_changes`,
            `overlapping_stream_ids` and `conflicts`, which describe only the
            mainline's independent changes. `0` for any other branch.
        merge_record:
          $ref: '#/components/schemas/MergeRecord'

    MergeRecord:
      type: object
      description: |
        What a merged branch's merge decided, read from the merge's own record
        rather than recomputed. Present only for a merged branch.
      required: [claim_id, merged_at, merged_at_position, recorded, skipped_stream_ids, decisions, exclusions, resume_count]
      properties:
        claim_id:
          type: string
          format: uuid
          description: The `BranchMerged` event's id
        merged_at:
          type: string
          format: date-time
        merged_at_position:
          type: integer
          format: int64
        note:
          type: string
          description: The merge note
        recorded:
          type: boolean
          description: |
            `false` for a merge made before decisions were recorded: its
            `exclusions` are then derived from the replay plan (every entity
            the plan left out kept the mainline's version), without saying
            which were conflicts.
        replayed_event_count:
          type: integer
          description: |
            How many branch events the merge set out to replay. Absent when
            not recorded.
        skipped_stream_ids:
          type: array
          items:
            type: string
            format: uuid
          description: The entities whose branch changes were not replayed.
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/MergeRecordDecision'
        exclusions:
          type: array
          items:
            $ref: '#/components/schemas/MergeRecordExclusion'
        resume_count:
          type: integer
          description: How many resumes of an interrupted merge recorded decisions
        pre_merge_snapshot_id:
          type: string
          format: uuid
          description: |
            The mainline snapshot the merge took just before claiming the branch
            (`snapshot_before`). Absent when it took none. The snapshot itself
            may since have been deleted.
        replayed_through_position:
          type: integer
          format: int64
          description: |
            The log position of the last change the merge (or a resume of it)
            replayed onto the mainline. With `pre_merge_snapshot_id` it bounds
            exactly what the merge changed:
            `GET /snapshots/{pre_merge_snapshot_id}/compare-current?until=<this>`.
            For a merge that replayed nothing it is the position of the merge's
            own claim, so that range lists none of the merge's changes. Absent
            when no replayed change carrying this merge's provenance was found,
            or when the scan for them hit its cap before finding every change
            the merge's plan replays.

    MergeRecordDecision:
      type: object
      description: One decision a merge (or a resume of it) recorded.
      required: [stream_id, entity_type, entity_name, resolution, decided_at]
      properties:
        stream_id:
          type: string
          format: uuid
        entity_type:
          type: string
        entity_name:
          type: string
          description: Empty when the entity cannot be named
        kind:
          type: string
          enum: [edit_edit, delete_edit, create_create]
          description: The conflict decided. Absent when not recorded.
        fields:
          type: array
          items:
            type: string
        deleted_by:
          type: string
          enum: [branch, main]
        resolution:
          type: string
          enum: [branch, main]
        rationale:
          type: string
        decided_at:
          type: string
          enum: [merge, resume]

    MergeRecordExclusion:
      type: object
      description: One entity the merge left behind without a conflict.
      required: [stream_id, entity_type, entity_name]
      properties:
        stream_id:
          type: string
          format: uuid
        entity_type:
          type: string
        entity_name:
          type: string
          description: Empty when the entity cannot be named
        rationale:
          type: string

    MergeConflict:
      type: object
      description: |
        One entity the branch and the mainline changed incompatibly. At most one
        conflict is reported per entity; when several kinds apply the most
        severe wins, in the order `delete_edit`, `edit_edit`, `create_create`.
      required: [stream_id, entity_type, entity_name, kind, detail, supported_resolutions]
      properties:
        stream_id:
          type: string
          format: uuid
          description: |
            The contested entity's id. This is the key a merge resolution uses.
        supported_resolutions:
          type: array
          items:
            type: string
            enum: [branch, main]
          description: |
            The resolutions that would actually produce the outcome they name for
            THIS conflict. Usually both, but two shapes accept only `main`, and
            sending anything outside this list is rejected with
            `400 invalid_resolution` rather than silently doing the opposite:

            - `delete_edit` where the **mainline** is the deleter. Replaying the
              branch's edits cannot resurrect a deleted entity, so `branch` would
              report success while the entity stayed deleted.
            - `create_create`. The two sides are different entities by
              construction, so `branch` would promote the branch's copy and leave
              the mainline's beside it - the duplicate this conflict class exists
              to prevent.

            A review UI should offer only these values.
          example: ["branch", "main"]
        entity_type:
          type: string
          description: |
            Kind of entity the conflict is about, in the `ChangeEntry.entity_type`
            vocabulary - the same response carries both, so they use one
            vocabulary (derived from the same event-type table).
          example: "person"
        entity_name:
          type: string
          description: |
            Display name of the entity, for the review UI. Empty when the name
            cannot be resolved (for instance the entity exists only on the
            branch, or only as a deletion).
          example: "Ada Lovelace"
        kind:
          type: string
          enum: [edit_edit, delete_edit, create_create]
          description: |
            - `edit_edit` - both sides changed the same field to different
              values. Structural changes count: linking a child on one side
              while the other unlinks the same child is an `edit_edit` on the
              field `children[<person-id>]`.
            - `delete_edit` - exactly one side deleted the entity while the
              other went on changing it. (Both sides deleting is not a conflict;
              they agree.)
            - `create_create` - both sides independently created an entity
              carrying the same GEDCOM xref, so the two creations are the same
              real-world record.
        fields:
          type: array
          items:
            type: string
          description: |
            The contested field names, sorted. Present for `edit_edit` only -
            the other kinds are whole-entity conflicts with no field to name.
          example: ["surname"]
        deleted_by:
          type: string
          enum: [branch, main]
          description: |
            For `delete_edit` only: which side deleted the entity. The other
            side is the one whose edits `field_values` lists.
        field_values:
          type: array
          items:
            $ref: '#/components/schemas/MergeConflictField'
          description: |
            What each side says, per contested field, in words: the value at
            the fork (`base_value`), the branch's (`branch_value`) and the
            mainline's (`main_value`). Ids of referenced entities (people,
            families, sources, citations, evidence analyses, notes, media, a
            subject or a fact owner) are resolved to their names; a list of ids
            is rendered as its names joined with `; `.

            - `edit_edit` - one entry per entry of `fields`, in the same order.
            - `delete_edit` - one entry per field the editing side changed; the
              deleting side's value is `null` (see `deleted_by`).
            - `create_create` - absent.
        detail:
          type: string
          description: Human-readable explanation of the conflict, ready to display
          example: "The branch and main disagree on Surname"

    MergeConflictField:
      type: object
      description: One contested field of a conflict, valued on each side.
      required: [field, label, base_value, branch_value, main_value]
      properties:
        field:
          type: string
          description: |
            The raw field key, as `MergeConflict.fields` reports it - for
            example `surname`, `children[<person-id>]` or `names[<name-id>]`.
          example: "surname"
        label:
          type: string
          description: |
            The field's readable name, ready to display. A structural key is
            named by what it refers to, e.g. `Child: Ada Lovelace`.
          example: "Surname"
        base_value:
          type: string
          nullable: true
          description: |
            The value when the branch forked (its `base_position`). `null` when
            the field was not set then, or when the fork state could not be
            read in full - `base_unknown` tells the two apart.
          example: "Byron"
        base_unknown:
          type: boolean
          description: |
            Present and `true` when the fork state could not be read in full
            (the history is too long to replay), so `base_value` is unknown
            rather than unset. Absent otherwise.
        branch_value:
          type: string
          nullable: true
          description: The branch's value. `null` when it is not set, or the branch deleted the entity.
          example: "Lovelace"
        main_value:
          type: string
          nullable: true
          description: The mainline's value. `null` when it is not set, or the mainline deleted the entity.
          example: "King"

    BranchMergeRequest:
      type: object
      description: |
        What to do with the merge. Both properties are optional; an empty object
        merges a conflict-free branch with no note.
      properties:
        note:
          type: string
          maxLength: 1000
          description: |
            Why this research was promoted. Recorded on the `BranchMerged` event
            and returned as the branch's `merge_note` thereafter.
        resolutions:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/MergeResolutionEntry'
          description: |
            One entry per entity whose side is being decided. Every conflict
            reported by `GET /branches/{id}/compare` must appear here or the
            merge is refused with `409 merge_conflicts`. Entries for
            non-conflicting entities the branch touched are allowed, and are the
            only supported way to exclude an entity from the merge.

            An array rather than a map keyed by id, so the generated Go and
            TypeScript types stay usable. A `stream_id` may appear at most once.

            Capped at 1000 entries, matching the scan cap: a branch that touches
            more entities than that is refused before resolutions are read, so
            a longer array can never be useful.
        snapshot_before:
          type: boolean
          description: |
            Off unless set. Mark the mainline with a snapshot named "Before merging <branch>"
            just before the merge claims the branch, and record its id on the
            merge record (`pre_merge_snapshot_id`), so the merge's effect can
            be compared from it afterwards. The snapshot is taken after every
            check that can refuse the merge up front; if the merge is refused
            after it (the mainline moved, or a concurrent merge claimed the
            branch first), the snapshot is removed again. An unrelated mainline
            change made at the same moment can still land between the snapshot
            and the merge's replay; it then shows in that comparison without
            the merge provenance (`merged_from`) every replayed change carries.

    MergeResolutionEntry:
      type: object
      description: The side that wins for one entity.
      required: [stream_id, resolution]
      properties:
        stream_id:
          type: string
          format: uuid
          description: |
            The entity being decided. Must be an entity the branch actually
            changed - an unknown id is a `400`, not a no-op.
        resolution:
          type: string
          enum: [branch, main]
          description: |
            - `branch` - replay the branch's events for this entity onto main.
            - `main` - keep main's version; the entity's branch changes are
              dropped and its id is reported in `skipped_stream_ids`.
        rationale:
          type: string
          maxLength: 1000
          description: |
            Optional: why this side won - the evidence weighed (GPS: resolve
            conflicts by reasoning, not by fiat). Recorded with the merge
            (`BranchMerged`, or `BranchMergeResumed` for a resume). Blank is
            the same as absent.

    BranchMergeResult:
      type: object
      description: What the merge actually did.
      required:
        - branch
        - merged_at_position
        - replayed_event_count
        - skipped_stream_ids
      properties:
        branch:
          $ref: '#/components/schemas/Branch'
        merged_at_position:
          type: integer
          format: int64
          description: |
            The event log's head position at the moment of the merge, recorded
            on the `BranchMerged` marker event. Every mainline event after it,
            on the branch's entities, is this merge's replay.

            Note that positions are one global sequence shared by every branch,
            so this number counts other branches' events too. Do not treat
            `merged_at_position - base_position` as a count of what this merge
            promoted — it is inflated by unrelated branch activity.
          example: 128
        replayed_event_count:
          type: integer
          description: How many branch events were re-appended to the mainline
          example: 7
        skipped_stream_ids:
          type: array
          items:
            type: string
            format: uuid
          description: |
            The entities resolved to `main`, whose branch changes were
            deliberately not replayed. `[]`, never `null`, when nothing was
            skipped.
        pre_merge_snapshot:
          $ref: '#/components/schemas/Snapshot'

    BranchMergeConflictError:
      type: object
      description: |
        A refused merge. Shares `code`/`message` with the standard `Error`
        shape and adds the conflict list the `merge_conflicts` code needs.
      required: [code, message]
      properties:
        code:
          type: string
          enum: [merge_conflicts, branch_not_active, merge_already_claimed, branch_too_large, main_too_far_ahead, merge_plan_stale, merge_dangling_reference, merge_empty]
          description: Which refusal this is - see the operation's 409 description
          example: "merge_conflicts"
        message:
          type: string
          description: Human-readable explanation
          example: "branch has unresolved merge conflicts: 1 of 1 conflicts have no resolution"
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/MergeConflict'
          description: |
            The full conflict list. Present only for `merge_conflicts`, where it
            carries every conflict - not just the undecided ones - so the review
            UI can render the whole picture.
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/MergeBlocker'
          description: |
            Present only for `merge_dangling_reference`: every reference the
            merge would break, not just the first (#831).

    BranchMergePrecheckRequest:
      type: object
      description: The resolutions a merge would be sent with.
      properties:
        resolutions:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/MergeResolutionEntry'
          description: |
            As for `BranchMergeRequest.resolutions`: conflict decisions and
            exclusions (`main` for an entity left out). A `rationale` is
            accepted and ignored. A `stream_id` may appear at most once.

    BranchMergePrecheckResult:
      type: object
      description: What would block the proposed merge.
      required: [blockers]
      properties:
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/MergeBlocker'
          description: Every merge blocker, in replay order. `[]`, never `null`, when the merge is clear.

    BranchEvidenceCoverage:
      type: object
      description: |
        The evidence-coverage warning of a branch (#838): how many facts and
        relationships it changed, and which of them have no evidence analysis
        or proof summary on the branch.
      required: [changed_fact_count, uncovered, has_more]
      properties:
        changed_fact_count:
          type: integer
          description: How many facts and relationships the branch changed.
        uncovered:
          type: array
          items:
            $ref: '#/components/schemas/BranchChangedFact'
          description: The changed facts with no evidence on the branch, by subject name. `[]` when every change is documented.
        has_more:
          type: boolean
          description: The branch's own events hit the read cap, so the counts may be incomplete.

    BranchChangedFact:
      type: object
      description: One fact or relationship a branch changed.
      required: [kind, subject_type, subject_id, subject_name, change_count]
      properties:
        kind:
          type: string
          enum: [fact, relationship, deletion]
          description: |
            `fact` for a person's or family's fact (`fact_type` says which);
            `relationship` for a family's partners or children; `deletion` for
            a person or family the mainline has that the branch deleted.
        fact_type:
          # The fact changed (e.g. `person_birth`); absent for a relationship or a deletion.
          $ref: '#/components/schemas/FactType'
        subject_type:
          type: string
          enum: [person, family]
          description: What the fact is about - the subject an analysis of it has.
        subject_id:
          type: string
          format: uuid
        subject_name:
          type: string
          description: The subject's display name as the branch sees it (a deleted one as the mainline has it); empty when nothing names it.
        change_count:
          type: integer
          description: How many of the branch's changes touched the fact.

    BranchHealth:
      type: object
      description: |
        What a branch introduces into the tree's checks (#838): its findings
        the mainline does not have. Every list is `[]`, never `null`, when
        empty.
      required: [validation_issues, quality_issues, duplicates, error_count, warning_count, info_count, resolved_count]
      properties:
        validation_issues:
          type: array
          items:
            $ref: '#/components/schemas/BranchValidationIssue'
          description: Validation issues the branch introduces, errors first, then warnings, then information.
        quality_issues:
          type: array
          items:
            $ref: '#/components/schemas/BranchQualityIssue'
          description: Per-person quality issues the branch introduces, by person name.
        duplicates:
          type: array
          items:
            $ref: '#/components/schemas/BranchDuplicatePair'
          description: Potential duplicate pairs the branch introduces, most likely first.
        error_count:
          type: integer
          description: How many of `validation_issues` are errors.
        warning_count:
          type: integer
          description: How many of `validation_issues` are warnings.
        info_count:
          type: integer
          description: How many of `validation_issues` are information.
        resolved_count:
          type: integer
          description: How many of the mainline's findings, of every kind, the branch no longer has.

    BranchValidationIssue:
      type: object
      description: A validation issue a branch introduces, with the records it is about by name.
      required: [key, severity, code, message]
      properties:
        key:
          type: string
          description: Stable across the branch and the mainline (code, record, related record, occurrence).
        severity:
          type: string
          enum: [error, warning, info]
        code:
          type: string
        message:
          type: string
        record_id:
          type: string
          format: uuid
        record_type:
          type: string
          enum: [person, family, source]
        record_name:
          type: string
        related_record_id:
          type: string
          format: uuid
        related_record_type:
          type: string
          enum: [person, family, source]
        related_record_name:
          type: string

    BranchQualityIssue:
      type: object
      description: A person's quality issue a branch introduces.
      required: [key, person_id, person_name, issue]
      properties:
        key:
          type: string
          description: Stable across the branch and the mainline (person and issue).
        person_id:
          type: string
          format: uuid
        person_name:
          type: string
        issue:
          type: string
          description: The issue, as `/quality/persons/{id}` words it.

    BranchDuplicatePair:
      type: object
      description: A potential duplicate pair a branch introduces.
      required: [key, person1_id, person1_name, person2_id, person2_name, confidence, match_reasons]
      properties:
        key:
          type: string
          description: Stable across the branch and the mainline (the two person ids, in id order).
        person1_id:
          type: string
          format: uuid
        person1_name:
          type: string
        person2_id:
          type: string
          format: uuid
        person2_name:
          type: string
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
        match_reasons:
          type: array
          items:
            type: string

    MergeBlocker:
      type: object
      description: |
        One cross-entity reference a merge (or resume) would break (#831): the
        entity whose branch changes break it, and the entity it references or
        would cascade onto.
      required:
        - stream_id
        - entity_type
        - entity_name
        - referenced_id
        - referenced_type
        - referenced_name
        - kind
        - suggested_resolution
        - message
      properties:
        stream_id:
          type: string
          format: uuid
          description: The entity whose branch changes break the reference.
        entity_type:
          type: string
          description: Its type, in the change-entry vocabulary (`family`, `citation`, `media`, `evidence_analysis`, ...).
          example: family
        entity_name:
          type: string
          description: Its display name, or `""` when nothing names it.
        referenced_id:
          type: string
          format: uuid
          description: The entity it references, or would cascade onto.
        referenced_type:
          type: string
          description: The referenced entity's type, in the same vocabulary.
          example: person
        referenced_name:
          type: string
          description: The referenced entity's display name, or `""` when nothing names it.
        kind:
          type: string
          enum:
            - missing_person
            - missing_source
            - source_delete_orphans_citation
            - missing_media_owner
            - owner_delete_orphans_media
            - missing_gps_artifact
            - missing_gps_subject
            - subject_delete_orphans_gps
            - person_merge_conflicts_main
          description: |
            - `missing_person` - a family partner or child link, or an
              association, names a person the mainline will not have.
            - `missing_source` - a citation cites a source the mainline will
              not have.
            - `source_delete_orphans_citation` - a source delete would also
              delete a mainline citation of it.
            - `missing_media_owner` - a media item is attached to a person,
              family or source the mainline will not have.
            - `owner_delete_orphans_media` - an owner delete would also delete
              a mainline media item the branch never saw.
            - `missing_gps_artifact` - the branch edits GPS research the
              mainline no longer has (`referenced_id` is that research).
            - `missing_gps_subject` - GPS research is about a person or family
              the mainline will not have.
            - `subject_delete_orphans_gps` - a person or family delete would
              also delete mainline GPS research the branch never saw.
            - `person_merge_conflicts_main` - a person merge made on the branch
              (on the survivor, `stream_id`) cannot land as made: the mainline
              has since merged the merged person (`referenced_id`) itself, or
              the two persons are children of different families there.
        suggested_resolution:
          type: string
          enum: [leave_out, include_referenced]
          description: |
            The one-step fix: `leave_out` resolves `stream_id` to `main`;
            `include_referenced` resolves `referenced_id` to `branch` (offered
            when a `main` resolution is what excluded it).
        message:
          type: string
          description: The refusal in words (ids, not names).

    BranchMergeResumeRequest:
      type: object
      description: Decisions for the entities a resume reported as pending.
      properties:
        resolutions:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/MergeResolutionEntry'
          description: |
            One entry per entity listed in a previous refusal's
            `pending_stream_ids`. Any other entity is a `400`: its fate was
            fixed when the merge was claimed. A `stream_id` may appear at most
            once.

    BranchMergeResumeResult:
      type: object
      description: What the resume did. The merge is complete when this is returned.
      required:
        - branch
        - merged_at_position
        - replayed_event_count
        - already_replayed_stream_ids
        - skipped_stream_ids
        - reprojected_stream_ids
      properties:
        branch:
          $ref: '#/components/schemas/Branch'
        merged_at_position:
          type: integer
          format: int64
          description: The log head position recorded by the original merge's claim.
          example: 128
        replayed_event_count:
          type: integer
          description: |
            How many branch events THIS call re-appended to the mainline. `0`
            when the merge was already complete.
          example: 3
        already_replayed_stream_ids:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Entities whose branch changes were already on the mainline, and so
            were left alone. `[]`, never `null`.
        skipped_stream_ids:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Entities resolved to `main` (by the merge, by an earlier resume, or
            by this one), whose branch changes are deliberately not replayed.
            `[]`, never `null`.
        reprojected_stream_ids:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Entities whose branch changes were already in the mainline's event
            log but whose mainline read model was behind it (an earlier
            attempt's projection failed after its append). This call
            re-projected them from the log; no events were appended for them.
            Also lists citations whose source's citation count this call had to
            recount. `[]`, never `null`.

    BranchMergeResumeError:
      type: object
      description: |
        A refused resume. Shares `code`/`message` with the standard `Error`
        shape and adds the pending entity list.
      required: [code, message]
      properties:
        code:
          type: string
          enum: [merge_not_claimed, merge_resume_needs_resolution, merge_dangling_reference, branch_too_large, merge_resume_concurrent]
          # Distinct Go constant names: the last two values are shared with
          # BranchMergeConflictError's enum, and a name collision would make
          # the generator prefix every constant of both enums.
          x-enum-varnames: [ResumeMergeNotClaimed, ResumeNeedsResolution, ResumeDanglingReference, ResumeBranchTooLarge, ResumeConcurrent]
          description: Which refusal this is - see the operation's 409 description
          example: "merge_resume_needs_resolution"
        message:
          type: string
          description: Human-readable explanation
        pending_stream_ids:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Present only for `merge_resume_needs_resolution`: the entities that
            need a resolution before the resume can proceed.
        pending:
          type: array
          items:
            $ref: '#/components/schemas/MergePendingEntity'
          description: |
            Present only for `merge_resume_needs_resolution`: the entities of
            `pending_stream_ids`, in the same order, named and with the reason
            each needs a decision and the resolutions it accepts (#830).
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/MergeBlocker'
          description: |
            Present only for `merge_dangling_reference`: every reference the
            resolutions given would break (#831).

    MergePendingEntity:
      type: object
      description: |
        One entity an interrupted merge has not replayed onto the mainline yet
        (#830).
      required: [stream_id, entity_type, entity_name, reason, needs_resolution, supported_resolutions]
      properties:
        stream_id:
          type: string
          format: uuid
          description: The entity's id; the key a resume resolution uses.
        entity_type:
          type: string
          description: Kind of entity, in the `ChangeEntry.entity_type` vocabulary.
          example: "person"
        entity_name:
          type: string
          description: |
            Display name of the entity as the branch sees it. Empty when
            nothing names it.
          example: "Ada Lovelace"
        reason:
          type: string
          enum: [ready, main_changed, main_removed, no_plan, breaks_reference, needs_repair]
          x-enum-varnames: [PendingReady, PendingMainChanged, PendingMainRemoved, PendingNoPlan, PendingBreaksReference, PendingNeedsRepair]
          description: |
            - `ready` - the merge's recorded plan still covers it; a resume
              replays it without asking.
            - `main_changed` - the mainline changed it after the merge was
              planned, so the merge's decision about it no longer describes
              the mainline.
            - `main_removed` - the mainline deleted it (or merged the person
              into another) after the merge started; replaying the branch's
              changes would restore nothing.
            - `no_plan` - the merge predates recorded replay plans, so nothing
              says whether it should be replayed.
            - `breaks_reference` - replaying it would leave the mainline
              referencing something it no longer has, or delete mainline data
              the branch never saw.
            - `needs_repair` - its changes reached the mainline's history, but
              the mainline's data does not show them yet (or a source's
              citation count is off); a resume rebuilds it from the history
              without asking.
        needs_resolution:
          type: boolean
          description: |
            True unless `reason` is `ready` or `needs_repair`: a resume
            refuses with `merge_resume_needs_resolution` until it is resolved.
        supported_resolutions:
          type: array
          items:
            type: string
            enum: [branch, main]
          description: |
            The resolutions a resume accepts for it. Empty for `ready` and
            `needs_repair`; only
            `main` for `main_removed` and `breaks_reference`.

    RelationshipPathNode:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Display name of the person (e.g., "John Smith")

    RelationshipPath:
      type: object
      properties:
        name:
          type: string
          description: Relationship name (e.g., "1st cousin once removed")
        pathFromA:
          type: array
          items:
            $ref: '#/components/schemas/RelationshipPathNode'
        pathFromB:
          type: array
          items:
            $ref: '#/components/schemas/RelationshipPathNode'
        commonAncestorId:
          type: string
          format: uuid
        generationDistanceA:
          type: integer
        generationDistanceB:
          type: integer

    RelationshipResult:
      type: object
      properties:
        personA:
          $ref: '#/components/schemas/Person'
        personB:
          $ref: '#/components/schemas/Person'
        paths:
          type: array
          items:
            $ref: '#/components/schemas/RelationshipPath'
        isRelated:
          type: boolean
        summary:
          type: string
          description: Human-readable relationship summary

    # Note schemas
    Note:
      type: object
      description: A shared GEDCOM NOTE record that can be referenced by multiple entities
      required: [id, text, version]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
          description: Full note text (may contain embedded newlines from CONT/CONC lines)
        mime:
          type: string
          description: >-
            GEDCOM 7.0 shared note (SNOTE) media type of the text, e.g.
            "text/plain" or "text/html". Empty for plain NOTE records.
        language:
          type: string
          description: >-
            GEDCOM 7.0 shared note (SNOTE) BCP 47 language tag for the text,
            e.g. "en" or "zh-Hans".
        translations:
          type: array
          description: GEDCOM 7.0 shared note (SNOTE) alternate-language renderings
          items:
            $ref: '#/components/schemas/NoteTranslation'
        gedcom_xref:
          type: string
          description: GEDCOM cross-reference ID (e.g., "@N1@") for round-trip support
        version:
          type: integer
          format: int64
          description: Optimistic locking version
        updated_at:
          type: string
          format: date-time

    NoteTranslation:
      type: object
      description: An alternate-language rendering of a shared note (GEDCOM 7.0 SNOTE TRAN)
      required: [text]
      properties:
        text:
          type: string
          description: Translated note content
        mime:
          type: string
          description: Media type of the translated text, e.g. "text/plain" or "text/html"
        language:
          type: string
          description: BCP 47 language tag for this translation, e.g. "es"

    NoteCreate:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: Note text content
