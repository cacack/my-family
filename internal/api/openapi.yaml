  # Media endpoints
  /persons/{id}/media:
    parameters:
      - $ref: '#/components/parameters/personId'

    get:
      operationId: listPersonMedia
      summary: List media attached to a person
      description: |
        Returns the person's media metadata, newest first. With `?branch=` the
        person and the list are read from that branch's isolated view.
      tags: [media]
      parameters:
        - $ref: '#/components/parameters/branchScope'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
      responses:
        '200':
          description: List of media
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaList'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      operationId: uploadPersonMedia
      summary: Upload media to a person
      description: |
        Uploads a new media item for the person. With `?branch=` the item is
        created on that branch only (and the person must exist there); the
        uploaded bytes belong to that new item.
      tags: [media]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - title
                - file
              properties:
                title:
                  type: string
                  description: Display title for the media
                  maxLength: 500
                description:
                  type: string
                  description: Optional description
                media_type:
                  $ref: '#/components/schemas/MediaType'
                file:
                  type: string
                  format: binary
                  description: The file to upload (max 10MB)
      responses:
        '201':
          description: Media uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: File too large (max 10MB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /media/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Media ID

    get:
      operationId: getMedia
      summary: Get media metadata
      description: |
        Returns the media item's metadata. With `?branch=` it is read from that
        branch's isolated view.
      tags: [media]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      responses:
        '200':
          description: Media metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      operationId: updateMedia
      summary: Update media metadata
      description: |
        Updates the media item's metadata (never its file). With `?branch=` the
        edit lands on that branch only; the file bytes are shared with the
        mainline and are not copied.
      tags: [media]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaUpdate'
      responses:
        '200':
          description: Media updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      operationId: deleteMedia
      summary: Delete media
      description: |
        Deletes the media item. With `?branch=` it is deleted on that branch
        only; the mainline item and its file are untouched.
      tags: [media]
      parameters:
        - $ref: '#/components/parameters/branchScope'
        - $ref: '#/components/parameters/versionParam'
      responses:
        '204':
          description: Media deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /media/{id}/content:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Media ID

    get:
      operationId: downloadMedia
      summary: Download media file
      description: |
        Returns the media file. With `?branch=` the item is resolved through that
        branch's isolated view (a branch-deleted item is not found); the bytes
        themselves are shared with the mainline.
      tags: [media]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      responses:
        '200':
          description: Media file content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

