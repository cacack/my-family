  # Citation template endpoints
  /citation-templates:
    get:
      operationId: listCitationTemplates
      summary: List available citation templates
      description: Returns all Evidence Explained citation templates, optionally filtered by source type
      tags: [citation-templates]
      parameters:
        - name: source_type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SourceType'
          description: Filter templates by source type
      responses:
        '200':
          description: List of citation templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitationTemplateList'

  /citation-templates/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Template ID (e.g., census.us.federal)

    get:
      operationId: getCitationTemplate
      summary: Get a citation template by ID
      tags: [citation-templates]
      responses:
        '200':
          description: Citation template details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitationTemplate'
        '404':
          $ref: '#/components/responses/NotFound'

  /citation-templates/{id}/preview:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Template ID (e.g., census.us.federal)

    post:
      operationId: previewCitationTemplate
      summary: Preview a citation template with provided fields
      description: Renders a citation preview without requiring a saved citation. Useful for live preview during editing.
      tags: [citation-templates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fields]
              properties:
                fields:
                  type: object
                  additionalProperties:
                    type: string
                  description: Map of field key to value
      responses:
        '200':
          description: Formatted citation preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormattedCitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /citations/{id}/format:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: formatCitation
      summary: Format a citation using its template
      description: |
        Renders the citation as full and short formatted text using the
        associated template. With `?branch=` the citation is read from that
        branch's isolated view.
      tags: [citations]
      parameters:
        - $ref: '#/components/parameters/branchScope'
      responses:
        '200':
