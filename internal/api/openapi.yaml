          type: string
          description: Updated submitter name
          minLength: 1
          maxLength: 200
        address:
          $ref: '#/components/schemas/Address'
        phone:
          type: array
          items:
            type: string
          description: Updated phone numbers
        email:
          type: array
          items:
            type: string
          description: Updated email addresses
        language:
          type: string
          description: Updated preferred language
        media_id:
          type: string
          format: uuid
