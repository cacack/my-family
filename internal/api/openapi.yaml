          description: Total number of repositories
        limit:
          type: integer
        offset:
          type: integer

    # Association schemas (GEDCOM ASSO records)
    Association:
      type: object
      required: [id, person_id, associate_id, role, version]
      properties:
        id:
          type: string
          format: uuid
        person_id:
          type: string
          format: uuid
          description: The person who has the association
        person_name:
          type: string
          description: Denormalized name of the person
        associate_id:
          type: string
          format: uuid
          description: The associated person
        associate_name:
          type: string
          description: Denormalized name of the associate
        role:
          type: string
          description: Role of the association (e.g., godparent, witness)
        phrase:
          type: string
          description: Human-readable description (GEDCOM 7.0 PHRASE)
        notes:
          type: string
          description: Inline note text
        note_ids:
          type: array
