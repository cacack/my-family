# Codecov configuration
# https://docs.codecov.com/docs/codecovyml-reference
#
# Aligned with local checks (make check-coverage, .testcoverage.yml):
# - The ignore list below mirrors .testcoverage.yml's exclude list, so both
#   measure the same files. Keep the two in sync.
# - Local gates statements: 85% per package, 75% total.
# - Codecov counts lines, and a line only partly run counts as uncovered, so
#   the same tests read a few points lower here (87.6% local vs about 83%
#   on Codecov in Nov 2026). The project target sits at 80% to allow for that.
# - Informational only: the local check is the gate.

coverage:
  status:
    # Project coverage - overall repository coverage
    project:
      default:
        # 80%: Codecov's line count runs a few points under the local
        # statement count (see the note at the top)
        target: 80%
        # Allow 2% drop to accommodate new features with complex setup
        threshold: 2%
        # Only check coverage on code that can be tested
        paths:
          - "internal/"
        # Exclude paths that don't need coverage
        removed_code_behavior: adjust_base
        # Don't block PRs - informational only
        informational: true

    # Patch coverage - coverage of changed lines in PR
    patch:
      default:
        # Target 75% of new lines - prioritize meaningful tests over line count
        target: 75%
        # Only apply to actual code changes
        paths:
          - "internal/"
        # Don't block PRs - informational only
        informational: true

# Ignore files that don't need test coverage.
# Mirrors the exclude list in .testcoverage.yml.
ignore:
  - "cmd/**/*"
  - "web/**/*"
  - "**/*_test.go"
  - "**/testdata/**"
  - "internal/repository/postgres/**"  # Requires live DB
  - "internal/repository/sqlite/**"    # Integration tests cover this
  - "internal/web/**"                  # Static file embedding (build-tag dependent)
  - "internal/integration/**"          # Test-only package, runs in its own CI job
  - "internal/testutil/**"             # Test support; PostgreSQL paths need Docker
  - "**/generated.go"                  # oapi-codegen output (internal/api/generated.go)

# Comment configuration for PRs
comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true
