version: 2
updates:
  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    cooldown:
      default-days: 5
      include:
        - "*"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "go"
    ignore:
      # Code generator: a bump changes internal/api/generated.go, so CI's
      # "Verify Go generated code" step fails by construction and the PR can
      # never merge unattended (#709). Bump it by hand with `make generate` in
      # the same PR. The oapi-codegen/runtime library stays Dependabot-managed.
      - dependency-name: "github.com/oapi-codegen/oapi-codegen/v2"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    cooldown:
      default-days: 5
      include:
        - "*"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
    # Ship minor/patch action bumps as one PR. Individual PRs break CodeQL,
    # which requires init/autobuild/analyze/upload-sarif on a matching version,
    # and leave later PRs stale once the first one merges. Majors stay separate.
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # npm (Svelte frontend)
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    cooldown:
      default-days: 5
      include:
        - "*"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "frontend"
    ignore:
      # TypeScript 7 (native-compiler major) is blocked by SvelteKit's peer cap
      # (@sveltejs/kit caps typescript at ^6.0.0). Tracked in #655 — remove this
      # ignore when adopting TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Code generator: a bump can change src/lib/api/types.generated.ts, so
      # CI's "Verify TypeScript generated types" step fails by construction
      # (#709). Bump it by hand with `make generate` in the same PR.
      - dependency-name: "openapi-typescript"

  # Docker base images in Dockerfile (SHA-pinned; Dependabot keeps digests fresh)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    cooldown:
      default-days: 5
      include:
        - "*"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # Odd Node majors are short-lived non-LTS releases, and web/package.json's
      # engines field excludes them. Track even (LTS) majors only.
      - dependency-name: "node"
        versions: ["25.x", "27.x", "29.x"]
