name: Auto Rebase PRs

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Rebase open PRs
        uses: peter-evans/rebase@e4945786f7ca41fe6e101cead4395f5489593943 # v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # Dependabot rebases its own PRs (label: dependencies); any PR can
          # opt out with no-auto-rebase.
          exclude-labels: |
            dependencies
            no-auto-rebase
