name: Auto Rebase PRs

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Rebase open PRs
        uses: peter-evans/rebase@d6f70ba4beda4faa44e582a974ec3b7b40713951 # v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # Dependabot rebases its own PRs (label: dependencies); any PR can
          # opt out with no-auto-rebase.
          exclude-labels: |
            dependencies
            no-auto-rebase
