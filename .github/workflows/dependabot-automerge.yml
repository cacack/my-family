name: Dependabot Auto-Merge

on: pull_request_target

# The logic lives in cacack/workflows so a fix lands once for every repo that
# calls it, instead of being copy-pasted and drifting. Pinned to a commit SHA
# like every other action here, so changes there are opt-in and Dependabot
# does the bumping.
#
# The secrets are mapped one by one rather than with `secrets: inherit`, which
# would hand the called workflow every secret this repo holds. These two are
# the my-family-steward App, whose `workflows` permission GITHUB_TOKEN cannot
# be granted — that is what lets auto-merge be enabled on PRs that edit
# .github/workflows/*.
#
# v2 blocks harden-runner egress by default, so this job matches the `block`
# posture every other workflow here uses. v1 audited instead, which is why
# this is pinned forward rather than left alone.
#
# A called workflow's job cannot request more than the caller grants here, and
# anything omitted from this block is `none` rather than absent. So this must
# cover every scope that job declares — `pull-requests` included, or the run
# fails at startup with no jobs and no steps, before the `if:` on Dependabot is
# ever evaluated. Granting only `contents: read` is what broke this (#708).
permissions:
  contents: read
  pull-requests: read

jobs:
  automerge:
    uses: cacack/workflows/.github/workflows/dependabot-automerge.yml@3325a01c0abd49361d05b209d42bf3b4a2d0c230 # v2.0.1
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
